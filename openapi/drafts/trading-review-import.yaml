openapi: 3.0.3
info:
  title: Trading Review Import HTTP API (DRAFT)
  version: 0.1.0-draft
  description: ADR-076 미채택 IC-P01~P06 후보. active public/Compute 계약·runtime을 변경하지 않는다.
x-contract-status: draft
x-policy-status: proposed
x-runtime-enabled: false
x-tls-required: true
x-member-state-gate: required-before-resource-lookup
x-member-write-linearization: unresolved-review-gate
x-delegation-audience: refinvest:trading-review:import:v1
x-user-delegation-profile:
  status: proposed
  algorithm: RS256
  type: refinvest-user-delegation+jwt
  subject: canonical-positive-decimal-int64
  actor: act.sub must match authenticated service caller
  issuerAndKeys: explicit trusted registry
  scopeMatching: exact registered route permission; no wildcard/admin bypass
  timeSizeRotation: separate review gate; no new numeric TTL/skew/deadline chosen
  scopeEncoding: single-string-exact-operation-class
x-operation-registry: method + route + import audience + exact scope + authenticated caller allowlist
x-unknown-commit-recovery: same-owner-operation-key-and-authoritative-fence
x-deletion-control:
  contract: trading-review-account-book.yaml
  operationId: getOwnerTradingDeletionRequest
  path: /internal/trading-review/v1/deletion-requests/{deletionRequestId}
  audience: refinvest:trading-review:account-book:v1
  scope: trading-review:owner:read
  accessMode: deletion-control-owner
  separateDelegationRequired: true
  status: separate-unadopted-profile; no import-token auto-upgrade
security:
- ServiceCredential: []
  UserDelegation: []
