components:
  securitySchemes:
    ServiceCredential:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-credential
    UserDelegation:
      type: apiKey
      in: header
      name: X-RefInvest-User-Delegation
  schemas:
    ExistingNumericId:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      maxLength: 19
      description: 기존/신규 decimal ID 후보. int64 상한·owner는 별도 semantic gate로 검증한다.
    CreateImport:
      $ref: ../core-api.yaml#/components/schemas/CreateTradingImportSessionRequest
    ExactSessionVersionSet:
      type: object
      additionalProperties: false
      required:
      - normalizer
      - reconstruction
      - versionSetHash
      properties:
        normalizer:
          $ref: ../core-api.yaml#/components/schemas/NormalizerVersionSet
        reconstruction:
          $ref: ../core-api.yaml#/components/schemas/ReconstructionVersionSet
        analytics:
          allOf:
          - $ref: ../core-api.yaml#/components/schemas/AnalyticsVersionSet
          nullable: true
        versionSetHash:
          $ref: ../core-api.yaml#/components/schemas/Sha256
    ValidateImport:
      type: object
      additionalProperties: false
      properties:
        targetVersionSet:
          allOf:
          - $ref: '#/components/schemas/ExactSessionVersionSet'
          nullable: true
    UploadMetadata:
      type: object
      required:
      - role
      - contentType
      - byteSize
      - sha256
      - dialectCandidate
      additionalProperties: false
      properties:
        role:
          $ref: ../core-api.yaml#/components/schemas/TradingArtifactRole
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: 'IC-P01 미채택 후보: omitted/null filename 허용. non-null일 때만 안전 basename·Unicode/길이를 검증한다.'
          nullable: true
        contentType:
          type: string
          enum:
          - text/csv
          - application/vnd.ms-excel
        byteSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 52428800
        sha256:
          $ref: ../core-api.yaml#/components/schemas/Sha256
        dialectCandidate:
          type: string
          enum:
          - AUTO
          - BINANCE_USDS_TRADE_HISTORY_V1
          - BINANCE_USDS_POSITION_HISTORY_V1
      oneOf:
      - properties:
          role:
            enum:
            - TRADE_HISTORY
          dialectCandidate:
            enum:
            - AUTO
            - BINANCE_USDS_TRADE_HISTORY_V1
      - properties:
          role:
            enum:
            - POSITION_HISTORY
          dialectCandidate:
            enum:
            - AUTO
            - BINANCE_USDS_POSITION_HISTORY_V1
    UploadImport:
      type: object
      additionalProperties: false
      required:
      - metadata
      - file
      properties:
        metadata:
          $ref: '#/components/schemas/UploadMetadata'
        file:
          type: string
          format: binary
    Artifact:
      type: object
      required:
      - id
      - importSessionId
      - role
      - contentType
      - byteSize
      - sha256
      - uploadStatus
      - retentionStatus
      - rawReparseAvailable
      - coverage
      - uploadedAt
      properties:
        id:
          $ref: '#/components/schemas/ExistingNumericId'
        importSessionId:
          $ref: '#/components/schemas/ExistingNumericId'
        role:
          $ref: ../core-api.yaml#/components/schemas/TradingArtifactRole
        filename:
          type: string
          nullable: true
          description: raw lifecycle 뒤 null; storage path가 아니다.
        contentType:
          type: string
          enum:
          - text/csv
          - application/vnd.ms-excel
        byteSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 52428800
        sha256:
          $ref: ../core-api.yaml#/components/schemas/Sha256
        dialectCandidate:
          type: string
        detectedDialect:
          type: string
          nullable: true
        schemaFingerprint:
          type: string
          nullable: true
        uploadStatus:
          $ref: ../core-api.yaml#/components/schemas/ArtifactUploadStatus
        retentionStatus:
          $ref: ../core-api.yaml#/components/schemas/ArtifactRetentionStatus
        rawReparseAvailable:
          type: boolean
        coverage:
          allOf:
          - $ref: ../core-api.yaml#/components/schemas/ArtifactCoverage
          type: object
