components:
  securitySchemes:
    AccessCookieAuth:
      $ref: ../core-api.yaml#/components/securitySchemes/AccessCookieAuth
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      description: opaque wire ID; typed legacy/Snowflake/ownership checks are runtime gates
    ViewVersion:
      type: string
      enum:
      - TRADING_ANALYSIS_READ_V2_DRAFT
    SelectionRole:
      type: string
      enum:
      - SUBJECT
      - COMPARISON
      - EXCLUDED
      - RELATION_CANDIDATE
      - RELATED_ENTRY
      - PRIOR_BASELINE
      - SELECTION_BOUNDARY
    Page:
      type: integer
      minimum: 0
      default: 0
    Size:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
    Total:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
    LedgerUnitFacts:
      type: object
      required:
      - id
      - type
      - instrumentIds
      - direction
      - reconstructionStatus
      - reconciliationStatus
      - capability
      - dataQuality
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - FUTURES_POSITION_EPISODE
        instrumentIds:
          type: array
          minItems: 1
          items:
            type: string
        direction:
          type: string
          enum:
          - LONG
          - SHORT
        openedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        initialQuantity:
          allOf:
          - $ref: ../core-api.yaml#/components/schemas/Quantity
          type: object
          nullable: true
        initialNotional:
          allOf:
          - $ref: ../core-api.yaml#/components/schemas/Money
          type: object
          nullable: true
        reconstructionStatus:
          $ref: ../core-api.yaml#/components/schemas/ReconstructionStatus
        reconciliationStatus:
          $ref: ../core-api.yaml#/components/schemas/ReconciliationStatus
        capability:
          type: array
          items:
            $ref: ../core-api.yaml#/components/schemas/AnalysisCapability
        dataQuality:
          type: array
          items:
            type: string
      additionalProperties: false
    TypedMetric:
      oneOf:
      - $ref: ../compute-api.yaml#/components/schemas/AnalyticsReentryMetric
      - $ref: ../compute-api.yaml#/components/schemas/AnalyticsExposureMetric
      - $ref: ../compute-api.yaml#/components/schemas/AnalyticsHoldingMetric
      discriminator:
        propertyName: definitionId
    Selection:
      type: object
      additionalProperties: false
      required:
      - analysisRunId
      - ledgerRevisionId
      - analysisResultHash
      - kind
      - metricId
      - role
      - reason
      - order
      properties:
        analysisRunId:
          $ref: '#/components/schemas/OpaqueId'
        ledgerRevisionId:
          $ref: '#/components/schemas/OpaqueId'
        analysisResultHash:
          $ref: ../core-api.yaml#/components/schemas/Sha256
        kind:
          type: string
          enum:
          - UNIT
          - MEMBERSHIP
          - ALLOCATION
          - DIRECT_RECORD
        metricId:
          allOf:
          - $ref: ../core-api.yaml#/components/schemas/BehaviorMetricId
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/SelectionRole'
          nullable: true
        reason:
          type: string
          nullable: true
        order:
          type: string
          enum:
          - UTF16_CODE_UNIT_ASC
    SelectionQuery:
      type: object
      additionalProperties: false
      required: []
      properties:
        metricId:
          $ref: ../core-api.yaml#/components/schemas/BehaviorMetricId
        role:
          $ref: '#/components/schemas/SelectionRole'
        reason:
          type: string
          minLength: 1
        page:
          $ref: '#/components/schemas/Page'
        size:
          $ref: '#/components/schemas/Size'
      allOf:
      - anyOf:
        - not:
            required:
            - role
        - required:
          - metricId
      - anyOf:
        - not:
            required:
            - reason
        - required:
          - metricId
          - role
          properties:
            role:
              enum:
              - EXCLUDED
    EvidenceQuery:
      allOf:
      - $ref: '#/components/schemas/SelectionQuery'
      - required:
        - metricId
    MembershipQuery:
      allOf:
      - $ref: '#/components/schemas/SelectionQuery'
      - required:
        - metricId
    PageQuery:
      type: object
      additionalProperties: false
      required: []
      properties:
        page:
          $ref: '#/components/schemas/Page'
        size:
          $ref: '#/components/schemas/Size'
    MembershipSummary:
      type: object
      additionalProperties: false
      required:
      - selection
      - page
      - size
      - total
      - items
      properties:
        selection:
          allOf:
          - $ref: '#/components/schemas/Selection'
          - properties:
              kind:
                enum:
                - MEMBERSHIP
              metricId:
                $ref: ../core-api.yaml#/components/schemas/BehaviorMetricId
        page:
          type: integer
          enum:
          - 0
        size:
          type: integer
          enum:
          - 20
        total:
          $ref: '#/components/schemas/Total'
        items:
          type: array
          items:
            $ref: ../compute-api.yaml#/components/schemas/InternalEvidenceMembership
    MetricView:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - analysisRunId
      - analysisResultHash
      - metric
      - membershipSummary
      properties:
        schemaVersion:
          $ref: '#/components/schemas/ViewVersion'
        analysisRunId:
          $ref: '#/components/schemas/OpaqueId'
        analysisResultHash:
          $ref: ../core-api.yaml#/components/schemas/Sha256
        metric:
          $ref: '#/components/schemas/TypedMetric'
        membershipSummary:
          $ref: '#/components/schemas/MembershipSummary'
    UnitView:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - analysisRunId
      - ledgerRevisionId
      - analysisResultHash
      - unit
      - classification
      properties:
        schemaVersion:
          $ref: '#/components/schemas/ViewVersion'
        analysisRunId:
          $ref: '#/components/schemas/OpaqueId'
        ledgerRevisionId:
          $ref: '#/components/schemas/OpaqueId'
        analysisResultHash:
          $ref: ../core-api.yaml#/components/schemas/Sha256
        unit:
          $ref: '#/components/schemas/LedgerUnitFacts'
        classification:
          allOf:
          - $ref: ../compute-api.yaml#/components/schemas/AnalyticsOutcomeClassification
          nullable: true
    RecordEvidence:
      type: object
      additionalProperties: false
      required:
      - tradingRecord
      - sourceEvidence
      properties:
        tradingRecord:
          $ref: ../core-api.yaml#/components/schemas/TradingRecordEvidence
        sourceEvidence:
          $ref: ../core-api.yaml#/components/schemas/SourceEvidenceSnapshot
    AllocationBundle:
      type: object
      additionalProperties: false
      required:
      - allocationId
      - allocation
      - membershipIds
      - records
      properties:
        allocationId:
          $ref: '#/components/schemas/OpaqueId'
        allocation:
          $ref: ../core-api.yaml#/components/schemas/PositionAllocationEvidence
        membershipIds:
          type: array
          items:
            $ref: '#/components/schemas/OpaqueId'
          minItems: 1
          uniqueItems: true
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordEvidence'
          minItems: 1
    DirectRecordBundle:
      type: object
      additionalProperties: false
      required:
      - recordId
      - membershipIds
      - evidence
      properties:
        recordId:
          $ref: '#/components/schemas/OpaqueId'
        membershipIds:
          type: array
          items:
            $ref: '#/components/schemas/OpaqueId'
          minItems: 1
          uniqueItems: true
        evidence:
          $ref: '#/components/schemas/RecordEvidence'
    UnitPage:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - page
      - size
      - total
      - items
      - selection
      properties:
        schemaVersion:
          $ref: '#/components/schemas/ViewVersion'
        page:
          $ref: '#/components/schemas/Page'
        size:
          $ref: '#/components/schemas/Size'
        total:
          $ref: '#/components/schemas/Total'
        items:
          type: array
          items:
            $ref: '#/components/schemas/UnitView'
        selection:
          allOf:
          - $ref: '#/components/schemas/Selection'
          - properties:
              kind:
                enum:
                - UNIT
    MembershipPage:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - page
      - size
      - total
      - items
      - selection
      properties:
        schemaVersion:
          $ref: '#/components/schemas/ViewVersion'
        page:
          $ref: '#/components/schemas/Page'
        size:
          $ref: '#/components/schemas/Size'
        total:
          $ref: '#/components/schemas/Total'
        items:
          type: array
          items:
            $ref: ../compute-api.yaml#/components/schemas/InternalEvidenceMembership
        selection:
          allOf:
          - $ref: '#/components/schemas/Selection'
          - properties:
              kind:
                enum:
                - MEMBERSHIP
              metricId:
                $ref: ../core-api.yaml#/components/schemas/BehaviorMetricId
    AllocationPage:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - page
      - size
      - total
      - items
      - selection
      properties:
        schemaVersion:
          $ref: '#/components/schemas/ViewVersion'
        page:
          $ref: '#/components/schemas/Page'
        size:
          $ref: '#/components/schemas/Size'
        total:
          $ref: '#/components/schemas/Total'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AllocationBundle'
        selection:
          allOf:
          - $ref: '#/components/schemas/Selection'
          - properties:
              kind:
                enum:
                - ALLOCATION
              metricId:
                $ref: ../core-api.yaml#/components/schemas/BehaviorMetricId
    DirectEvidencePage:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - page
      - size
      - total
      - items
      - selection
      properties:
        schemaVersion:
          $ref: '#/components/schemas/ViewVersion'
        page:
          $ref: '#/components/schemas/Page'
        size:
          $ref: '#/components/schemas/Size'
        total:
          $ref: '#/components/schemas/Total'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DirectRecordBundle'
        selection:
          allOf:
          - $ref: '#/components/schemas/Selection'
          - properties:
              kind:
                enum:
                - DIRECT_RECORD
              metricId:
                $ref: ../core-api.yaml#/components/schemas/BehaviorMetricId
    ReviewView:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - analysisRunId
      - ledgerRevisionId
      - resultSchemaVersion
      - analysisResultHash
      - evidenceHash
      - analysisPeriod
      - qualitySummary
      - capabilitySnapshot
      - metrics
      - findings
      - analyticsVersionSet
      - analysisConfig
      - analysisConfigHash
      - createdAt
      - lineage
      properties:
        schemaVersion:
          $ref: '#/components/schemas/ViewVersion'
        analysisRunId:
          $ref: '#/components/schemas/OpaqueId'
        ledgerRevisionId:
          $ref: '#/components/schemas/OpaqueId'
        resultSchemaVersion:
          type: string
          enum:
          - TRADING_ANALYTICS_RESULT_SCHEMA_V1
        analysisResultHash:
          $ref: ../core-api.yaml#/components/schemas/Sha256
        evidenceHash:
          $ref: ../core-api.yaml#/components/schemas/Sha256
        analysisPeriod:
          $ref: ../core-api.yaml#/components/schemas/AnalysisPeriod
        qualitySummary:
          $ref: ../core-api.yaml#/components/schemas/TradingQualityReport
        capabilitySnapshot:
          type: array
          items:
            $ref: ../core-api.yaml#/components/schemas/AnalysisCapability
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricView'
          minItems: 3
          maxItems: 3
        findings:
          type: array
          items:
            $ref: ../core-api.yaml#/components/schemas/BehaviorFinding
          maxItems: 0
        analyticsVersionSet:
          $ref: ../core-api.yaml#/components/schemas/AnalyticsVersionSet
        analysisConfig:
          $ref: ../core-api.yaml#/components/schemas/AnalysisConfig
        analysisConfigHash:
          $ref: ../core-api.yaml#/components/schemas/Sha256
        createdAt:
          type: string
          format: date-time
        lineage:
          allOf:
          - $ref: ../core-api.yaml#/components/schemas/VersionLineage
          nullable: true
  examples:
    PendingRun:
      value:
        id: '201'
        tradingBookId: '101'
        ledgerRevisionId: ledger-v1
        progressStage: QUEUED
        analyticsVersionSet:
          metricDefinitionVersionsByMetricId:
