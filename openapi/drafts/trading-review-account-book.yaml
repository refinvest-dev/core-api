openapi: 3.0.3
info:
  title: Trading Review Account/Book API (DRAFT)
  version: 0.1.0-draft
  description: ADR-075 미채택 계약 후보. 현재 public/Compute·ADR-074 두 GET을 대체하지 않으며 runtime 활성화 금지.
x-contract-status: draft
x-runtime-enabled: false
x-policy-status: proposed
x-member-state-gate: required-before-resource-lookup
x-tls-required: true
x-delegation-audience: refinvest:trading-review:account-book:v1
x-user-delegation-profile:
  status: proposed
  algorithm: RS256
  type: refinvest-user-delegation+jwt
  subject: canonical-positive-decimal-int64
  actor: act.sub must match authenticated service caller
  scopeMatching: exact-route-scope
  issuerAndKeys: explicit trusted registry
  timeSizeRotation: separate review gate; ADR-074 numeric proposals are not adopted
x-unknown-commit-recovery: same-owner-operation-key-and-authoritative-fence
security:
- ServiceCredential: []
  UserDelegation: []
externalDocs:
  url: https://github.com/refinvest-dev/context/blob/main/docs/TRADING_REVIEW_ACCOUNT_BOOK_API_DESIGN_DRAFT.md
  description: P01~P04 정책 후보와 auth/운영 채택 gate
