components:
  securitySchemes:
    ServiceCredential:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-credential
    UserDelegation:
      type: apiKey
      in: header
      name: X-RefInvest-User-Delegation
      description: 별도 RS256 위임 후보. service credential AND·issuer/audience/caller binding·현재 authority/owner 검증 필요.
  schemas:
    ExistingNumericId:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      maxLength: 19
