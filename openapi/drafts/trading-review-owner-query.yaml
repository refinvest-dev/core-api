openapi: 3.0.3
info:
  title: Trading Review Owner Query (DRAFT)
  version: 0.1.0-draft
  description: >-
    ADR-086의 단건 두 GET과 ADR-087의 Account 목록 GET 계약을 구분한다. YAML 전체와 runtime 활성화는 별도다.
    현재 공개 Core/Compute wire를 대체하지 않으며 실제 issuer/authority·TLS/key 운영/HTTP 수용 전 활성화하지 않는다.
x-contract-status: draft
x-security-policy: ADR-086
x-additional-security-policies: [ADR-087]
x-security-policy-document: docs/TRADING_REVIEW_OWNER_QUERY_AUTH_POLICY.md
x-runtime-enabled: false
x-member-state-gate: required-before-resource-lookup
externalDocs:
  description: 인증·위임·archive·오류·적용 gate 초안
  url: https://github.com/refinvest-dev/context/blob/main/docs/TRADING_REVIEW_OWNER_QUERY_CONTRACT_DRAFT.md
security:
  - ServiceCredential: []
    UserDelegation: []
paths:
  /internal/trading-review/v1/accounts:
    get:
      operationId: listOwnerTradingAccounts
      summary: TradingAccount 목록 (`ListTradingAccounts`)
      description: ADR-087의 Core→Go 연결 계약. 현재 legacy 구현/운영 전환은 별도이며 이 schema 변경이 route를 활성화하지 않는다. Account 삭제 차단 항목은
        items/total에서 함께 제외.
      x-security-policy: ADR-087
      x-query-profile:
        unknownParameters: reject
        duplicateParameters: reject
        missingOnlyDefaults: true
        decode: strict-utf8-once
        allowedKeys:
        - page
        - size
      x-response-max-bytes: 2097152
      x-item-max-bytes: 16384
      parameters:
      - $ref: ../core-api.yaml#/components/parameters/TradingAccountListPageParam
      - $ref: ../core-api.yaml#/components/parameters/TradingAccountListSizeParam
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/Tracestate'
      responses:
        '200':
          description: 동일 snapshot의 목록. 비어 있거나 범위 밖이면200·items=[]·실제 total.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: ../core-api.yaml#/components/schemas/TradingAccountPage
              examples:
                empty:
                  x-request-query:
                    page: 0
                    size: 20
                  value:
                    items: []
                    page: 0
                    size: 20
                    total: 0
                metadata:
                  x-request-query:
                    page: 0
                    size: 20
                  value:
                    items:
                    - &id001
                      id: '9223372036854775807'
                      venue: BINANCE
                      displayName: 보존된 계정
                      status: ARCHIVED
                      createdAt: '2026-11-28T00:00:00Z'
                    - id: '9007199254740993'
                      venue: BINANCE
                      displayName: 두 번째 계정
                      status: ACTIVE
                      createdAt: '2026-11-28T00:00:00Z'
                    page: 0
                    size: 20
                    total: 2
                outOfRange:
                  x-request-query:
                    page: 2147483647
                    size: 100
                  value:
                    items: []
                    page: 2147483647
                    size: 100
                    total: 2
                largeCount:
                  x-request-query:
                    page: 0
                    size: 1
                  value:
                    items:
                    - *id001
                    page: 0
                    size: 1
                    total: 9223372036854775807
        '400':
          description: 400 INVALID_REQUEST
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../core-api.yaml#/components/schemas/TradingAccountListError
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - INVALID_REQUEST
                    message:
                      type: string
                      enum:
                      - Invalid request
                    retryable:
                      type: boolean
                      enum:
                      - false
              examples:
                invalid_request:
                  value:
                    code: INVALID_REQUEST
                    message: Invalid request
                    traceId: '12345678901234567890123456789012'
                    retryable: false
        '403':
          description: 403 MEMBER_ACCESS_DENIED / CALLER_NOT_ALLOWED
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../core-api.yaml#/components/schemas/TradingAccountListError
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - MEMBER_ACCESS_DENIED
                      - CALLER_NOT_ALLOWED
                    message:
                      type: string
                      enum:
                      - Access denied
                    retryable:
                      type: boolean
                      enum:
                      - false
              examples:
                member_access_denied:
                  value:
                    code: MEMBER_ACCESS_DENIED
                    message: Access denied
                    traceId: '12345678901234567890123456789012'
                    retryable: false
                caller_not_allowed:
                  value:
                    code: CALLER_NOT_ALLOWED
                    message: Access denied
                    traceId: '12345678901234567890123456789012'
                    retryable: false
        '503':
          description: 503 AUTHORITY_UNAVAILABLE / OWNER_QUERY_UNAVAILABLE
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../core-api.yaml#/components/schemas/TradingAccountListError
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - AUTHORITY_UNAVAILABLE
                      - OWNER_QUERY_UNAVAILABLE
                    message:
                      type: string
                      enum:
                      - Service unavailable
                    retryable:
                      type: boolean
                      enum:
                      - true
              examples:
                authority_unavailable:
                  value:
                    code: AUTHORITY_UNAVAILABLE
                    message: Service unavailable
                    traceId: '12345678901234567890123456789012'
                    retryable: true
                owner_query_unavailable:
                  value:
                    code: OWNER_QUERY_UNAVAILABLE
                    message: Service unavailable
                    traceId: '12345678901234567890123456789012'
                    retryable: true
        '504':
          description: 504 REQUEST_DEADLINE_EXCEEDED
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../core-api.yaml#/components/schemas/TradingAccountListError
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - REQUEST_DEADLINE_EXCEEDED
                    message:
                      type: string
                      enum:
                      - Request deadline exceeded
                    retryable:
                      type: boolean
                      enum:
                      - true
              examples:
                request_deadline_exceeded:
                  value:
                    code: REQUEST_DEADLINE_EXCEEDED
                    message: Request deadline exceeded
                    traceId: '12345678901234567890123456789012'
                    retryable: true
        '401':
          description: 401 SERVICE_AUTHENTICATION_FAILED / USER_DELEGATION_INVALID
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../core-api.yaml#/components/schemas/TradingAccountListError
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - SERVICE_AUTHENTICATION_FAILED
                      - USER_DELEGATION_INVALID
                    message:
                      type: string
                      enum:
                      - Internal authentication failed
                    retryable:
                      type: boolean
                      enum:
                      - false
              examples:
                service_authentication_failed:
                  value:
                    code: SERVICE_AUTHENTICATION_FAILED
                    message: Internal authentication failed
                    traceId: '12345678901234567890123456789012'
                    retryable: false
                user_delegation_invalid:
                  value:
                    code: USER_DELEGATION_INVALID
                    message: Internal authentication failed
                    traceId: '12345678901234567890123456789012'
                    retryable: false
      x-runtime-enabled: false
      x-required-user-scope: trading-review:owner:accounts:list
      x-required-caller-operation: listOwnerTradingAccounts
      x-delegation-audience: refinvest:trading-review:owner-query:v1
  /internal/trading-review/v1/accounts/{accountId}:
    get:
      operationId: getOwnerTradingAccount
      x-security-policy: ADR-086
      x-required-user-scope: trading-review:owner:read
      x-response-max-bytes: 16384
      summary: 검증된 owner의 Account metadata 단건 조회 초안
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ExistingNumericId' }
        - { $ref: '#/components/parameters/Traceparent' }
        - { $ref: '#/components/parameters/Tracestate' }
      responses:
        '200':
          description: 삭제 Guard가 유효한 owner의 ACTIVE/ARCHIVED Account metadata (제안)
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '../core-api.yaml#/components/schemas/TradingAccount' }
              example: { id: '9223372036854775806', venue: BINANCE, displayName: owner account, status: ACTIVE, createdAt: '2026-11-07T00:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Deleted' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Deadline' }
  /internal/trading-review/v1/books/{bookId}:
    get:
      operationId: getOwnerTradingBook
      x-security-policy: ADR-086
      x-required-user-scope: trading-review:owner:read
      x-response-max-bytes: 16384
      summary: owner와 상위 Account Guard를 함께 확인한 Book metadata 단건 조회 초안
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ExistingNumericId' }
        - { $ref: '#/components/parameters/Traceparent' }
        - { $ref: '#/components/parameters/Tracestate' }
      responses:
        '200':
          description: 삭제되지 않은 ACTIVE/ARCHIVED Book과 parent의 metadata 조회 (제안)
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '../core-api.yaml#/components/schemas/TradingBook' }
              example: { id: '9223372036854775807', tradingAccountId: '9223372036854775806', venue: BINANCE, productFamily: LINEAR_PERPETUAL, positionMode: ONE_WAY, settlementAsset: USDT, reviewTimezone: UTC, status: ACTIVE, createdAt: '2026-11-07T00:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Deleted' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Deadline' }
components:
  securitySchemes:
    ServiceCredential:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-credential
      description: TLS 위의 Go 대상 caller별 credential. 브라우저 JWT/Compute key와 분리한다.
    UserDelegation:
      type: apiKey
      in: header
      name: X-RefInvest-User-Delegation
      description: 별도 issuer의 서명된 compact RS256 JWT. header로 전달하며 service credential과 함께 요구한다.
  schemas:
    ExistingNumericId:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      maxLength: 19
      description: 현재 DB profile의 canonical positive decimal int64. upper bound 9223372036854775807은 server가 추가 검사한다.
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema: { type: string }
      description: W3C 형식 검증. malformed 값은 새 trace로 처리하며 인증에 사용하지 않는다.
    Tracestate:
      name: tracestate
      in: header
      required: false
      schema: { type: string, maxLength: 512 }
      description: 유효 traceparent와 함께만 전파하며 baggage는 전달하지 않는다.
  headers:
    NoStore:
      required: true
      schema: { type: string, enum: [no-store] }
  responses:
    InvalidRequest:
      description: 400 INVALID_REQUEST. 인증 후 path/GET 입력 검증 실패.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '../core-api.yaml#/components/schemas/ErrorResponse' }
          example: { code: INVALID_REQUEST, message: Invalid request, traceId: draft-correlation, retryable: false }
    Unauthenticated:
      description: 401 SERVICE_AUTHENTICATION_FAILED 또는 USER_DELEGATION_INVALID. public 401로 무조건 중계하지 않는다.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '../core-api.yaml#/components/schemas/ErrorResponse' }
          example: { code: SERVICE_AUTHENTICATION_FAILED, message: Internal authentication failed, traceId: draft-correlation, retryable: false }
    Forbidden:
      description: 403 CALLER_NOT_ALLOWED 또는 MEMBER_ACCESS_DENIED. cause별 public mapping을 구분한다.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '../core-api.yaml#/components/schemas/ErrorResponse' }
          example: { code: MEMBER_ACCESS_DENIED, message: Access denied, traceId: draft-correlation, retryable: false }
    NotFound:
      description: 404 RESOURCE_NOT_FOUND. foreign/absent resource 모두 동일 shape, metadata 없음.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '../core-api.yaml#/components/schemas/ErrorResponse' }
          example: { code: RESOURCE_NOT_FOUND, message: Resource not found, traceId: draft-correlation, retryable: false }
    Deleted:
      description: 410 RESOURCE_DELETED. owned 삭제 Guard/tombstone만 해당하며 archive는 삭제가 아니다.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '../core-api.yaml#/components/schemas/ErrorResponse' }
          example: { code: RESOURCE_DELETED, message: Resource deleted, traceId: draft-correlation, retryable: false }
    Unavailable:
      description: 503 AUTHORITY_UNAVAILABLE 또는 OWNER_QUERY_UNAVAILABLE. 권한 확인을 우회하지 않는다.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '../core-api.yaml#/components/schemas/ErrorResponse' }
          example: { code: AUTHORITY_UNAVAILABLE, message: Service unavailable, traceId: draft-correlation, retryable: true }
    Deadline:
      description: 504 REQUEST_DEADLINE_EXCEEDED. 장기 Run deadline이나 job 취소 상태를 뜻하지 않는다.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '../core-api.yaml#/components/schemas/ErrorResponse' }
          example: { code: REQUEST_DEADLINE_EXCEEDED, message: Request deadline exceeded, traceId: draft-correlation, retryable: true }
