  version: 0.1.0-draft
  description: ADR-079/WP01~04 unadopted candidate. Existing active API/Compute/hash vectors unchanged.
x-contract-status: draft
x-policy-status: proposed
x-runtime-enabled: false
x-error-code-status: proposed-not-current-registry
x-example-evidence: synthetic transport/schema examples; no hash oracle, execution support or runtime acceptance
x-logical-hash-projection: unchanged; outputs/publish/retry are full binding, not added to the existing logical
  SHA root
x-strict-decoder: reject duplicate keys, coercion, duplicate query values and cancellation body; runtime gate
x-safe-error-details: allowlisted-only-runtime-gate
x-receipt-replay: current-authority-before-original-admission-kind; current-view-and-trace-are-not-frozen-bytes
x-timeouts: request lifetime is separate from durable work; browser abort does not cancel admitted work
