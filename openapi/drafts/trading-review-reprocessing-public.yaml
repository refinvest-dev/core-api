  schemas:
    OpaqueId:
      type: string
      minLength: 1
      description: Opaque legacy/Snowflake ID; Member subject rules are separate. Typed ownership is a runtime gate.
    NullOnly:
      type: string
      nullable: true
      enum:
      - null
    RequestedOutputs:
      type: string
      enum:
      - LEDGER_ONLY
      - LEDGER_AND_ANALYSIS
      - ANALYSIS_ONLY
    ReasonCode:
      type: string
      enum:
      - USER_REQUESTED
      - BUG_FIX
      - DEFINITION_UPGRADE
      - SUPPORT_RECOVERY
    Target:
      type: object
      required:
      - versionSetHash
      properties:
        normalizer:
          oneOf:
          - $ref: ../core-api.yaml#/components/schemas/NormalizerVersionSet
          - $ref: '#/components/schemas/NullOnly'
        reconstruction:
          oneOf:
          - $ref: ../core-api.yaml#/components/schemas/ReconstructionVersionSet
          - $ref: '#/components/schemas/NullOnly'
        analytics:
          oneOf:
          - $ref: ../core-api.yaml#/components/schemas/AnalyticsVersionSet
          - $ref: '#/components/schemas/NullOnly'
        versionSetHash:
          $ref: ../core-api.yaml#/components/schemas/Sha256
      additionalProperties: false
    RequestReprocessingV2Draft:
      type: object
      additionalProperties: false
      required:
      - sourceLedgerRevisionId
      - reprocessingType
      - targetVersionSet
      - requestedOutputs
      - reasonCode
      properties:
        sourceLedgerRevisionId:
          $ref: '#/components/schemas/OpaqueId'
        sourceAnalysisRunId:
          type: string
          minLength: 1
          nullable: true
        reprocessingType:
          $ref: ../core-api.yaml#/components/schemas/ReprocessingType
        targetVersionSet:
          $ref: '#/components/schemas/Target'
        requestedOutputs:
          $ref: '#/components/schemas/RequestedOutputs'
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        analysisConfig:
          $ref: ../core-api.yaml#/components/schemas/AnalysisConfig
        publishAsLatest:
          type: boolean
          default: true
        retryOfReprocessingRunId:
          $ref: '#/components/schemas/OpaqueId'
      oneOf:
      - properties:
          reprocessingType:
            enum:
            - REPARSE_SOURCE
          requestedOutputs:
            enum:
            - LEDGER_ONLY
          targetVersionSet:
            type: object
            required:
            - normalizer
            - reconstruction
            properties:
              normalizer:
