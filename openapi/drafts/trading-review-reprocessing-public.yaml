openapi: 3.0.3
info:
  title: Trading Reprocessing public HTTP API (DRAFT)
  version: 0.1.0-draft
  description: ADR-079/WP01~04 unadopted candidate. Existing active API/Compute/hash vectors unchanged.
x-contract-status: draft
x-policy-status: proposed
x-runtime-enabled: false
x-error-code-status: proposed-not-current-registry
x-example-evidence: synthetic transport/schema examples; no hash oracle, execution support or runtime acceptance
x-logical-hash-projection: unchanged; outputs/publish/retry are full binding, not added to the existing logical
  SHA root
x-strict-decoder: reject duplicate keys, coercion, duplicate query values and cancellation body; runtime gate
x-safe-error-details: allowlisted-only-runtime-gate
x-receipt-replay: current-authority-before-original-admission-kind; current-view-and-trace-are-not-frozen-bytes
x-timeouts: request lifetime is separate from durable work; browser abort does not cancel admitted work
paths:
  /trading-review/v2/trading-books/{tradingBookId}/reprocessing-runs:
    post:
      operationId: requestTradingReprocessingV2Draft
      x-access-mode: owner-current-guard
      x-result-scope: published-only
      x-side-effects: durable-intent-only
      x-replay-mode: original-admission-kind-current-view
      parameters:
      - name: tradingBookId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OpaqueId'
      - $ref: ../core-api.yaml#/components/parameters/PublicIdempotencyKey
      - $ref: ../core-api.yaml#/components/parameters/CsrfToken
      - name: traceparent
        in: header
        required: false
        schema:
          type: string
      - name: tracestate
        in: header
        required: false
        schema:
          type: string
      responses:
        '202':
          $ref: '#/components/responses/Run202'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Admit410'
        '422':
          $ref: '#/components/responses/Admit422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Admit503'
      x-idempotency-namespace: requestTradingReprocessing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestReprocessingV2Draft'
            examples:
              REPARSE_SOURCE_LEDGER_ONLY:
                $ref: '#/components/examples/REPARSE_SOURCE_LEDGER_ONLY'
              REPARSE_SOURCE_LEDGER_AND_ANALYSIS:
                $ref: '#/components/examples/REPARSE_SOURCE_LEDGER_AND_ANALYSIS'
              REBUILD_LEDGER_LEDGER_ONLY:
                $ref: '#/components/examples/REBUILD_LEDGER_LEDGER_ONLY'
              REBUILD_LEDGER_LEDGER_AND_ANALYSIS:
                $ref: '#/components/examples/REBUILD_LEDGER_LEDGER_AND_ANALYSIS'
              RERUN_RECONSTRUCTION_LEDGER_ONLY:
                $ref: '#/components/examples/RERUN_RECONSTRUCTION_LEDGER_ONLY'
              RERUN_RECONSTRUCTION_LEDGER_AND_ANALYSIS:
                $ref: '#/components/examples/RERUN_RECONSTRUCTION_LEDGER_AND_ANALYSIS'
              RERUN_ANALYTICS_ANALYSIS_ONLY:
                $ref: '#/components/examples/RERUN_ANALYTICS_ANALYSIS_ONLY'
              REEVALUATE_FINDINGS_ANALYSIS_ONLY:
                $ref: '#/components/examples/REEVALUATE_FINDINGS_ANALYSIS_ONLY'
              RetryRequest:
                $ref: '#/components/examples/RetryRequest'
              OmittedPublishAndNullOptionalSource:
                $ref: '#/components/examples/OmittedPublishAndNullOptionalSource'
    get:
      operationId: listTradingReprocessingRunsV2Draft
      x-access-mode: owner-current-guard
      x-result-scope: published-only
      x-side-effects: none
      x-replay-mode: none
      parameters:
      - name: tradingBookId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OpaqueId'
      - name: traceparent
        in: header
        required: false
        schema:
          type: string
      - name: tracestate
        in: header
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          $ref: '#/components/responses/Page200'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /trading-review/v2/trading-reprocessing-runs/{reprocessingRunId}:
    get:
      operationId: getTradingReprocessingRunV2Draft
      x-access-mode: owner-current-guard
      x-result-scope: published-only
      x-side-effects: none
      x-replay-mode: none
