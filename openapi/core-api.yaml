    post:
      operationId: cancelTradingReprocessing
      tags: [trading-reprocessing]
      summary: publication 전 재처리 best-effort 취소 (`CancelTradingReprocessing`)
      parameters:
        - $ref: '#/components/parameters/ReprocessingRunId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
      responses:
        '202':
          description: 취소 요청 접수 또는 existing terminal Run 반환.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingReprocessingRun' } } }
