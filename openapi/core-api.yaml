openapi: 3.0.3
info:
  title: core-api Public API
  version: "0.3.0"
  description: |
    Web(`web`) → Core(`core-api`) 계약. Web은 이 스펙만 보고 구현하며,
    Compute(`compute-api`)를 직접 호출하지 않는다(`AGENTS.md` §3, `AI_AGENT.md` §4).

    - 이 스펙은 `context` 레포가 소유한다. `compute-api.yaml`과 공유 도메인 타입
      (Asset/Condition/BacktestResult 등)을 파일 간 `$ref`로 재사용한다 — 같은 개념을 두 번
      정의하지 않는다.
    - 필드명은 `docs/GLOSSARY.md`의 코드 네이밍을 그대로 따른다(`docs/USECASES.md`).
    - `RunBacktest`는 **항상 비동기**다(`AGENTS.md` §4, `AI_AGENT.md` §2). DSL 의미론적 오류
      (`compute-api.yaml`의 `DSL_INVALID` 등 `FatalErrorCode`)는 이 API에서 동기 400으로 나타나지
      않고, 202 Accepted 이후 폴링 중 `status: FAILED`로 드러난다. 반면 StrategyVersion 자체의
      구조적 불변식 위반(`docs/DOMAIN.md` §1.2)은 `DefineStrategyVersion` 시점에 동기 400으로
      즉시 반환된다 — 이 둘은 서로 다른 계층의 검증이며 에러 스키마도 분리되어 있다(아래
      `StrategyVersionValidationError` vs `compute-api.yaml`의 `ValidationErrorResponse`).

    ## 인증
    - 인증은 Kakao, Naver, Google 소셜 로그인과 RefInvest 발급 JWT Cookie를 사용한다. Provider access
      token은 RefInvest 인증 토큰으로 사용하거나 영속화하지 않는다.
    - Access/Refresh JWT는 HttpOnly Cookie로만 전달한다. Web은 `POST /auth/refresh`와
      `POST /auth/logout`에 Cookie를 포함하며, JWT 문자열을 response body에서 받지 않는다.
    - OAuth 로그인 시작 시 `returnTo`에는 Web origin 내부의 상대 경로만 전달할 수 있다. Core는 이를
      OAuth state와 함께 보존·검증하며 임의 외부 URL로 redirect하지 않는다.
    - Free/Pro 정확한 제한 수치(월 백테스트 횟수, 허용 Asset, 백테스트 최대 기간)는 미정
      — `docs/DOMAIN.md` §1.5, Phase 0/2에서 결정.
    - `ListStrategies`/`ListBacktestRuns`의 페이지네이션 방식(offset vs cursor)은 아래 스펙에
      offset 기반으로 잠정 정의했으나 팀 확인 필요.

servers:
  - url: https://api.refinvest.example.com
    description: Web이 호출하는 Core public API. Compute는 이 서버 뒤에서 내부적으로만 호출됨.

security:
  - AccessCookieAuth: []

tags:
  - name: strategies
    description: Strategy/StrategyVersion 생성·조회 (`docs/USECASES.md` Strategy 모듈)
  - name: backtests
    description: 백테스트 실행·조회 (`docs/USECASES.md` Backtest 모듈, 항상 비동기)
  - name: assets
    description: Strategy Builder용 Asset 메타데이터와 향후 Data Explorer용 보류 시계열 프록시 (`docs/USECASES.md`, ADR-049)
  - name: account
    description: 소셜 로그인·세션·사용량·구독 (`docs/USECASES.md` Member / Auth / Subscription 모듈)
  - name: trading-accounts
    description: Trading Review account와 homogeneous Book (`docs/TRADING_REVIEW_API.md`)
  - name: trading-imports
    description: dual-artifact upload, validation, quality와 immutable LedgerRevision
  - name: trading-analysis
    description: pinned Revision 분석, Review, Metric, ReviewUnit과 evidence
  - name: trading-reprocessing
    description: immutable version/config reprocessing과 lineage
  - name: trading-deletion
    description: raw/session/Book/Account async deletion과 상태

paths:
  # ============ Strategy ============
  /strategies:
    post:
      operationId: createStrategy
      tags: [strategies]
      summary: 빈 Strategy 생성 (`CreateStrategy`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: 생성됨.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategySummary'
        '401': { $ref: '#/components/responses/Unauthorized' }

    get:
      operationId: listStrategies
      tags: [strategies]
      summary: 사용자의 전략 목록 (`ListStrategies`)
      description: Free/Pro 개수 제한은 `docs/DOMAIN.md` §1.5 — 정확한 수치는 미정(TODO 참고).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StrategySummary'
                  page: { type: integer }
                  size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /strategies/{strategyId}:
    get:
      operationId: getStrategy
      tags: [strategies]
      summary: Strategy와 그 StrategyVersion 목록 조회 (`GetStrategy`)
      parameters:
        - $ref: '#/components/parameters/StrategyIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /strategies/{strategyId}/versions:
    post:
      operationId: defineStrategyVersion
      tags: [strategies]
      summary: 새 StrategyVersion 생성 (`DefineStrategyVersion`)
      description: |
        `docs/DOMAIN.md` §1.2 불변식을 동기적으로 검증한다(Primary Signal Asset 정확히 1개,
        Execution Asset이 `ExecutionAssetSymbol`에 속함, conditions 최소 1개, window/lag
        양수 등). `positionPolicy`는 요청 바디에 없다 — ADR-009에 따라 서버가 고정값
        (`longOnly: true, singlePosition: true, duplicateEntry: IGNORE`)으로 채운다.
        생성된 StrategyVersion은 불변이다(ADR-013) — 수정 API는 없고, 조건을 바꾸려면 이 엔드포인트를
        다시 호출해 새 버전을 만든다.
      parameters:
        - $ref: '#/components/parameters/StrategyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefineStrategyVersionRequest'
      responses:
        '201':
          description: 생성됨.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyVersion'
        '400':
          description: StrategyVersion 구조적 불변식 위반(`docs/DOMAIN.md` §1.2). Compute의 DSL 의미론적 검증(Calendar 호환성 등)과는 다른 계층 — 위 info.description 참고.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyVersionValidationError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /strategies/{strategyId}/versions/preview:
    post:
      operationId: previewStrategy
      tags: [strategies]
      summary: 저장하지 않고 자연어 미리보기 생성 (`PreviewStrategy`)
      description: |
        `DefineStrategyVersionRequest`와 동일한 바디를 받아, StrategyVersion을 생성하지 않고
        자연어 문장만 반환한다. 사용자가 조건을 편집하는 동안(Level 1~3, `docs/ROADMAP.md` Phase 1
        UX) 실시간으로 호출된다. DSL과 문장이 항상 1:1 대응해야 한다(`docs/DOMAIN.md` §1.2 예시).
      parameters:
        - $ref: '#/components/parameters/StrategyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefineStrategyVersionRequest'
      responses:
        '200':
          description: |
            OK. 구조적으로 불완전한 입력(예: conditions 빈 배열)이어도 가능한 범위까지 문장으로
            표현하고 400을 던지지 않는다 — 미리보기는 저장 전 자유 편집 상태를 위한 것이기 때문.
          content:
            application/json:
              schema:
                type: object
                required: [previewText]
                properties:
                  previewText: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============ Backtest ============
  /strategy-versions/{versionId}/backtests:
    post:
      operationId: runBacktest
      tags: [backtests]
      summary: 백테스트 실행 요청, 항상 비동기 (`RunBacktest`)
      description: |
        요청 즉시 `BacktestRun(status=PENDING)`을 반환한다. 절대 동기로 결과를 기다리지 않는다
        (`AGENTS.md` §4, `AI_AGENT.md` §2). 실제 계산은 Core가 내부적으로 Compute의
        `POST /backtests`(`compute-api.yaml`)에 위임한다 — 이 위임은 Web에 노출되지 않는다.
        실행 전에 현재 Subscription tier의 Asset entitlement와 요청 기간을 검사하고, 월간 quota와
        동시 실행 capacity를 원자적으로 예약한다(ADR-020).
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period, feeModel]
              properties:
                period:
                  $ref: 'compute-api.yaml#/components/schemas/Period'
                feeModel:
                  $ref: 'compute-api.yaml#/components/schemas/FeeModel'
      responses:
        '202':
          description: 접수됨.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestRunSummary'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 현재 plan에서 요청 기간 또는 StrategyVersion의 Asset이 허용되지 않음.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                periodNotAllowed:
                  value: { code: BACKTEST_PERIOD_NOT_ALLOWED, message: Requested backtest period is not available for the current plan., traceId: trace-synthetic-001, retryable: false }
                assetNotAllowed:
                  value: { code: ASSET_NOT_ALLOWED_FOR_PLAN, message: Requested asset is not available for the current plan., traceId: trace-synthetic-002, retryable: false }
        '429':
          description: 현재 tier의 월간 quota 또는 동시 실행 capacity가 소진됨.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                monthlyLimitExceeded:
                  value: { code: BACKTEST_MONTHLY_LIMIT_EXCEEDED, message: Monthly backtest execution limit exceeded., traceId: trace-synthetic-003, retryable: false }
                concurrencyLimitExceeded:
                  value: { code: BACKTEST_CONCURRENCY_LIMIT_EXCEEDED, message: Concurrent backtest execution limit exceeded., traceId: trace-synthetic-004, retryable: false }
        '404': { $ref: '#/components/responses/NotFound' }

  /strategy-versions/{versionId}/backtest-runs/latest-completed:
    get:
      operationId: getLatestCompletedBacktestRun
      tags: [backtests]
      summary: StrategyVersion의 최신 완료 백테스트 조회
      description: |
        Web 상세 페이지의 직접 진입·새로고침 시 해당 StrategyVersion의 마지막 완료 결과를 복원한다.
        Strategy별 실행 이력 목록은 Second Backtest Rate 계측을 위한 pagination API이므로, 이 단건
        복원 조회에 목록을 페이지 조회·필터링해서 사용하지 않는다. 현재 인증 사용자가 소유한
        StrategyVersion만 조회할 수 있으며, 존재하지 않거나 타인 소유이면 404를 반환한다. 대상은
        `COMPLETED` 상태의 run으로 한정하고 `createdAt DESC` 기준 최신 한 건을 반환한다.
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 완료 run이 없으면 `run`은 null이고, 있으면 createdAt DESC 기준 최신 COMPLETED run이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestCompletedBacktestRunResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /strategy-versions/{versionId}/backtest-runs/latest-terminal:
    get:
      operationId: getLatestTerminalBacktestRun
      tags: [backtests]
      summary: StrategyVersion의 최신 종결 백테스트 조회
      description: |
        Web 상세 페이지의 직접 진입·새로고침 시 마지막 실행이 실패한 경우에도 실패 상태를 복원한다.
        이 조회는 `COMPLETED` 또는 `FAILED` 상태의 run 중 `createdAt DESC` 기준 최신 한 건을
        반환한다. 성공 결과 차트 복원은 `latest-completed`를 계속 사용하므로, 최신 실패가
        이전 완료 결과를 덮어쓰지 않는다. 현재 인증 사용자가 소유한 StrategyVersion만 조회할
        수 있으며, 존재하지 않거나 타인 소유이면 404를 반환한다.
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 종결 run이 없으면 `run`은 null이고, 있으면 createdAt DESC 기준 최신 COMPLETED 또는 FAILED run이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestTerminalBacktestRunResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }


  /backtest-runs/{runId}:
    get:
      operationId: getBacktestRun
      tags: [backtests]
      summary: 상태 폴링 및 결과 조회 (`PollBacktestStatus`, `GetBacktestResult` 통합)
      description: |
        Web은 이 엔드포인트를 2~3초 간격으로 폴링한다(`docs/ARCHITECTURE.md` §5). `status`가
        `COMPLETED`일 때만 `result`가 존재하고, `FAILED`일 때만 `failureReason`가 존재한다.
        Compute가 structured fatal error를 반환한 실패에는 `errorCode`도 존재한다
        (`docs/DOMAIN.md` §1.3 불변식).
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestRunDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /strategies/{strategyId}/backtest-runs:
    get:
      operationId: listBacktestRuns
      tags: [backtests]
      summary: 특정 Strategy의 백테스트 실행 이력 (`ListBacktestRuns`)
      description: Second Backtest Rate 계측의 데이터 소스(`docs/ROADMAP.md` Phase 2).
      parameters:
        - $ref: '#/components/parameters/StrategyIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BacktestRunSummary'
                  page: { type: integer }
                  size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============ Trading Review Account / Book ============
  /trading-accounts:
    post:
      operationId: createTradingAccount
      tags: [trading-accounts]
      summary: TradingAccount 생성 (`CreateTradingAccount`)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTradingAccountRequest' }
      responses:
        '201':
          description: 생성됨. 같은 idempotency request는 같은 Account를 반환한다.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingAccount' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listTradingAccounts
      tags: [trading-accounts]
      summary: TradingAccount 목록 (`ListTradingAccounts`)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingAccountPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /trading-accounts/{tradingAccountId}:
    get:
      operationId: getTradingAccount
      tags: [trading-accounts]
      summary: TradingAccount 조회 (`GetTradingAccount`)
      parameters:
        - $ref: '#/components/parameters/TradingAccountId'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingAccount' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
    delete:
      operationId: deleteTradingAccount
      tags: [trading-deletion]
      summary: TradingAccount subtree 비동기 삭제 (`DeleteTradingAccount`)
      parameters:
        - $ref: '#/components/parameters/TradingAccountId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
      responses:
        '202':
          description: tombstone/access revoke가 commit되고 삭제 요청이 접수됨.
          content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequest' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /trading-accounts/{tradingAccountId}/books:
    post:
      operationId: createTradingBook
      tags: [trading-accounts]
      summary: homogeneous TradingBook 생성 (`CreateTradingBook`)
      parameters:
        - $ref: '#/components/parameters/TradingAccountId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTradingBookRequest' } } }
      responses:
        '201':
          description: 생성됨.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingBook' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      operationId: listTradingBooks
      tags: [trading-accounts]
      summary: Account의 TradingBook 목록 (`ListTradingBooks`)
      parameters:
        - $ref: '#/components/parameters/TradingAccountId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingBookPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trading-books/{tradingBookId}:
    get:
      operationId: getTradingBook
      tags: [trading-accounts]
      summary: TradingBook 조회 (`GetTradingBook`)
      parameters: [ { $ref: '#/components/parameters/TradingBookId' } ]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingBook' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
    delete:
      operationId: deleteTradingBook
      tags: [trading-deletion]
      summary: TradingBook subtree 비동기 삭제 (`DeleteTradingBook`)
      parameters:
        - $ref: '#/components/parameters/TradingBookId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
      responses:
        '202':
          description: 삭제 요청 접수.
          content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequest' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ============ Trading Review Import / Ledger ============
  /trading-books/{tradingBookId}/imports:
    post:
      operationId: createTradingImportSession
      tags: [trading-imports]
      summary: dual-artifact ImportSession 생성 (`CreateTradingImportSession`)
      parameters:
        - $ref: '#/components/parameters/TradingBookId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTradingImportSessionRequest' } } }
      responses:
        '201':
          description: "`RECEIVED` session 생성."
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingImportSession' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      operationId: listTradingImports
      tags: [trading-imports]
      summary: Book ImportSession 목록 (`ListTradingImports`)
      parameters:
        - $ref: '#/components/parameters/TradingBookId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingImportSessionPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trading-import-sessions/{importSessionId}:
    get:
      operationId: getTradingImportSession
      tags: [trading-imports]
      summary: Import 상태/결과 조회 (`GetTradingImportSession`)
      parameters: [ { $ref: '#/components/parameters/ImportSessionId' } ]
      responses:
        '200':
          description: "`ACCEPTED`이면 createdLedgerRevisionId가 필수다."
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingImportSession' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
    delete:
      operationId: deleteTradingImportSession
      tags: [trading-deletion]
      summary: ImportSession과 dependent immutable Revision/result 삭제 (`DeleteTradingImportSession`)
      parameters:
        - $ref: '#/components/parameters/ImportSessionId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
      responses:
        '202':
          description: 삭제 요청 접수.
          content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequest' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /trading-import-sessions/{importSessionId}/artifacts:
    post:
      operationId: uploadTradingImportArtifact
      tags: [trading-imports]
      summary: CSV artifact를 Core에 multipart upload (`UploadTradingImportArtifact`)
      description: |
        artifact당 최대 50 MiB. Core encrypted write/verification이 끝나야 `UPLOADED`다.
        file upload도 JWT Cookie와 CSRF를 모두 요구하며 Compute로 직접 전송하지 않는다.
      parameters:
        - $ref: '#/components/parameters/ImportSessionId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadTradingImportArtifactRequest' }
            encoding:
              metadata: { contentType: application/json }
              file: { contentType: 'text/csv, application/vnd.ms-excel' }
      responses:
        '201':
          description: artifact 저장/검증 완료.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingSourceArtifact' } } }
        '200':
          description: same role/hash idempotent replay; 기존 artifact 반환.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingSourceArtifact' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /trading-import-sessions/{importSessionId}/validation:
    post:
      operationId: validateTradingImportSession
      tags: [trading-imports]
      summary: 비동기 normalization/reconciliation 시작 (`ValidateTradingImportSession`)
      parameters:
        - $ref: '#/components/parameters/ImportSessionId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ValidateTradingImportSessionRequest' } } }
      responses:
        '202':
          description: session이 `VALIDATING`; 이후 session을 polling한다.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingImportSession' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /trading-import-sessions/{importSessionId}/quality-report:
    get:
      operationId: getTradingImportQualityReport
      tags: [trading-imports]
      summary: Import validation/reconciliation quality 조회 (`GetTradingImportQualityReport`)
      parameters: [ { $ref: '#/components/parameters/ImportSessionId' } ]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingQualityReport' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResultUnavailable' }
        '410': { $ref: '#/components/responses/Gone' }

  /trading-source-artifacts/{artifactId}:
    delete:
      operationId: deleteTradingSourceArtifact
      tags: [trading-deletion]
      summary: raw-only 비동기 삭제 (`DeleteTradingSourceArtifact`)
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
      responses:
        '202':
          description: raw 접근 차단과 삭제 요청 접수. snapshot/ledger/result는 유지한다.
          content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequest' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /trading-books/{tradingBookId}/ledger-revisions:
    get:
      operationId: listLedgerRevisions
      tags: [trading-imports]
      summary: Book LedgerRevision 목록 (`ListLedgerRevisions`)
