        - name: membershipRole
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EvidenceMembershipRole' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewUnitPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResultUnavailable' }

  /trading-analysis-runs/{analysisRunId}/review-units/{reviewUnitId}:
    get:
      operationId: getReviewUnit
      tags: [trading-analysis]
      summary: ReviewUnit 조회 (`GetReviewUnit`)
      parameters:
        - $ref: '#/components/parameters/AnalysisRunId'
        - $ref: '#/components/parameters/ReviewUnitId'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewUnit' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResultUnavailable' }
        '410': { $ref: '#/components/responses/Gone' }

  /trading-analysis-runs/{analysisRunId}/review-units/{reviewUnitId}/evidence:
    get:
      operationId: getReviewUnitEvidence
      tags: [trading-analysis]
      summary: allocation→record→source snapshot evidence 조회 (`GetReviewUnitEvidence`)
      parameters:
        - $ref: '#/components/parameters/AnalysisRunId'
        - $ref: '#/components/parameters/ReviewUnitId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: raw 삭제 뒤에도 retained allowlist snapshot을 명시해 반환.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewUnitEvidencePage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResultUnavailable' }
        '410': { $ref: '#/components/responses/Gone' }

  # ============ Trading Review Reprocessing ============
  /trading-books/{tradingBookId}/reprocessing-runs:
    post:
      operationId: requestTradingReprocessing
      tags: [trading-reprocessing]
      summary: immutable 재처리 시작 (`RequestTradingReprocessing`)
      parameters:
        - $ref: '#/components/parameters/TradingBookId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PublicIdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RequestTradingReprocessingRequest' } } }
      responses:
        '202':
          description: Run 접수; same logical success는 기존 Run/result 반환.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingReprocessingRun' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      operationId: listTradingReprocessingRuns
      tags: [trading-reprocessing]
      summary: Book reprocessing 이력 (`ListTradingReprocessingRuns`)
      parameters:
        - $ref: '#/components/parameters/TradingBookId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingReprocessingRunPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trading-reprocessing-runs/{reprocessingRunId}:
    get:
      operationId: pollTradingReprocessingStatus
      tags: [trading-reprocessing]
      summary: ReprocessingRun 조회 (`PollTradingReprocessingStatus`)
      parameters: [ { $ref: '#/components/parameters/ReprocessingRunId' } ]
      responses:
        '200':
          description: source availability, child IDs, difference/failure/lineage 포함.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingReprocessingRun' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

