        '200':
          description: primary/object/runtime/backup purge 상태와 safe failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequest' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============ Asset / Strategy Builder 지원 (시계열 공개는 보류) ============
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: MVP Asset Universe 목록 (`ListAssets`)
      description: Core는 Compute의 `GET /assets`(`compute-api.yaml`) 응답을 그대로 프록시한다. Web은 Compute의 존재를 몰라도 된다(`AI_AGENT.md` §4).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: 'compute-api.yaml#/components/schemas/Asset'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /assets/{symbol}/availability:
    get:
      operationId: getAssetAvailability
      tags: [assets]
      summary: 특정 Asset의 상장일/데이터 가용 구간 (`GetAssetAvailability`)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            $ref: 'compute-api.yaml#/components/schemas/AssetSymbol'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'compute-api.yaml#/components/schemas/AssetAvailability'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assets/series:
    get:
      operationId: getSeries
      tags: [assets]
      summary: 보류된 다중 자산 시계열 capability (`GetSeries`)
      description: |
        Compute의 `GET /series`(`compute-api.yaml`)를 그대로 프록시하는 향후 Data Explorer용 capability다.
        ADR-049에 따라 MVP Web은 이 operation을 호출하거나 사용자에게 노출하지 않는다.
      x-refinvest-mvp-status: deferred
      parameters:
        - name: symbols
          in: query
          required: true
          description: "쉼표로 구분된 Asset Symbol 목록 (예: `QQQ,BTCUSDT`)"
          schema: { type: string }
          example: "QQQ,BTCUSDT"
        - name: metric
          in: query
          required: true
          schema:
            $ref: 'compute-api.yaml#/components/schemas/SeriesMetric'
        - name: start
          in: query
          required: true
          schema: { type: string, format: date }
        - name: end
          in: query
          required: true
          schema: { type: string, format: date }
        - name: datasetSnapshotId
          in: query
          required: false
          description: 과거 재현용 Snapshot ID. 생략하면 요청 시작 시 최신 published Snapshot 하나를 선택한다.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'compute-api.yaml#/components/schemas/SeriesResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: 선택한 DatasetSnapshot을 사용할 수 없거나 시계열 데이터가 손상됨.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'compute-api.yaml#/components/schemas/DatasetUnavailableErrorResponse'
                  - $ref: 'compute-api.yaml#/components/schemas/SeriesDataErrorResponse'

  # ============ Auth / Account ============
  /oauth2/authorization/{provider}:
    get:
      operationId: startSocialLogin
      tags: [account]
      summary: 소셜 로그인 시작 (`SocialLogin`)
      description: |
        Spring Security OAuth2 Authorization Code 흐름을 시작하고 선택한 provider로 302 redirect한다.
        로그인 성공 시 Access/Refresh Cookie를 설정한 뒤 `returnTo`의 검증된 상대 경로로 Web에
        redirect한다. provider callback(`/login/oauth2/code/{provider}`)은 provider 전용 내부 경로다.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [kakao, naver, google] }
        - name: returnTo
          in: query
          required: false
          schema: { type: string, default: / }
          description: Web origin 내부의 `/`로 시작하는 상대 경로. 외부 URL은 거부한다.
      responses:
        '302':
          description: OAuth provider authorization endpoint로 redirect.
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/csrf:
    get:
      operationId: issueCsrfToken
      tags: [account]
      summary: CSRF Cookie 발급
      description: |
        Cookie 인증을 사용하는 변경 요청 전에 호출한다. 응답의 `XSRF-TOKEN` Cookie는 HttpOnly가 아니며,
        Web은 값을 `X-XSRF-TOKEN` header로 echo한다. 인증 Cookie와 CSRF token은 별개다.
      security: []
      responses:
        '204':
          description: CSRF Cookie가 설정됨.
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [account]
      summary: Access/Refresh JWT 교체 (`RefreshSession`)
      description: |
        Refresh Cookie로 Refresh Token Rotation을 수행한다. 성공하면 기존 Refresh Token은 즉시
        무효화되고 새 Access/Refresh Cookie가 설정된다. JWT 문자열은 response body에 포함하지 않는다.
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          schema: { type: string }
          description: "`XSRF-TOKEN` Cookie 값을 echo한 CSRF token."
      security:
        - RefreshCookieAuth: []
      responses:
        '204':
          description: 새 Access/Refresh Cookie가 설정됨.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: CSRF token이 없거나 Cookie 값과 일치하지 않음.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      operationId: logout
      tags: [account]
      summary: 현재 세션 로그아웃 (`Logout`)
      description: Refresh Token 또는 그 가족을 무효화하고 Access/Refresh Cookie를 제거한다.
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          schema: { type: string }
          description: "`XSRF-TOKEN` Cookie 값을 echo한 CSRF token."
      security:
        - RefreshCookieAuth: []
      responses:
        '204':
          description: Refresh 상태가 무효화되고 인증 Cookie가 제거됨.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: CSRF token이 없거나 Cookie 값과 일치하지 않음.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /me/usage:
    get:
      operationId: getUsage
      tags: [account]
      summary: 이번 달 사용량 조회 (`GetUsage`)
      description: UTC calendar month 기준 사용량과 현재 Subscription tier의 Backtest 정책(ADR-020)을 반환한다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/subscription/upgrade:
    post:
      operationId: upgradeSubscription
      tags: [account]
      summary: Free → Pro 전환 (`UpgradeSubscription`)
      description: MVP는 상태값만 변경한다 — 실제 결제 연동은 Phase 5(`docs/ROADMAP.md`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    AccessCookieAuth:
      type: apiKey
      in: cookie
      name: REFINVEST_ACCESS_TOKEN
      description: RefInvest 발급 Access JWT(HttpOnly Cookie). Web은 이 값을 직접 읽지 않는다.
    RefreshCookieAuth:
      type: apiKey
      in: cookie
      name: REFINVEST_REFRESH_TOKEN
      description: RefInvest 발급 Refresh JWT(HttpOnly Cookie). refresh/logout 경계에서만 사용한다.

  parameters:
    StrategyIdParam:
      name: strategyId
      in: path
      required: true
      schema: { type: string }
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: "`XSRF-TOKEN` Cookie 값을 echo한다. Trading Review file upload도 예외가 아니다."
      schema: { type: string, minLength: 1, maxLength: 512 }
    PublicIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: owner+operation 범위의 opaque transport retry identity. same payload는 기존 resource, different payload는 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]+$'
    TradingAccountId:
      name: tradingAccountId
      in: path
      required: true
      schema: { type: string }
    TradingBookId:
      name: tradingBookId
      in: path
      required: true
      schema: { type: string }
    ImportSessionId:
      name: importSessionId
      in: path
      required: true
      schema: { type: string }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string }
    LedgerRevisionId:
      name: ledgerRevisionId
      in: path
      required: true
      schema: { type: string }
    AnalysisRunId:
      name: analysisRunId
      in: path
      required: true
      schema: { type: string }
    ReviewUnitId:
      name: reviewUnitId
      in: path
      required: true
      schema: { type: string }
    ReprocessingRunId:
      name: reprocessingRunId
      in: path
      required: true
      schema: { type: string }
    DeletionRequestId:
      name: deletionRequestId
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: 인증 실패.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 존재하지 않거나 본인 소유가 아님.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: 잘못된 요청.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: CSRF 또는 authorization 실패. 다른 owner resource는 이 응답 대신 404로 숨긴다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: idempotency payload 또는 현재 resource state와 충돌.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Gone:
      description: owner가 삭제한 resource 또는 raw-required operation의 source가 더 이상 없음.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableEntity:
      description: syntactically valid하지만 현재 계약/도메인 precondition을 만족하지 못함.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: artifact가 50 MiB 공개 계약 상한을 초과함.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: 허용되지 않은 multipart/file content type.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: 일시적 storage/Compute/capacity failure. retryable과 필요 시 Retry-After를 확인한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ResultUnavailable:
      description: 비동기 run/result가 아직 완료되지 않아 요청한 read model이 없음.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, traceId, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        traceId:
          type: string
          description: 거래 payload와 무관한 correlation identifier.
        retryable: { type: boolean }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
          description: raw source value/identifier/storage locator를 포함하지 않는 allowlisted detail.
    ErrorDetail:
      type: object
      required: [field, reason]
      additionalProperties: false
      properties:
        field: { type: string }
        reason: { type: string }
        rowNumber: { type: integer, minimum: 1 }
        artifactRole: { $ref: '#/components/schemas/TradingArtifactRole' }

    # ---- Trading Review common values ----
    DecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Arbitrary-precision decimal plain string. Exponent/leading plus 금지; source field는 sourceScale을 함께 보존한다.
      example: '123.4500'
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
      description: lowercase SHA-256 hex.
    VersionIdentifier:
      type: string
      minLength: 1
      maxLength: 200
      description: immutable exact version ID. `latest` 같은 mutable alias는 저장 응답에 나타나지 않는다.
    Money:
      type: object
      required: [amount, currency, sourceScale]
      properties:
        amount: { $ref: '#/components/schemas/DecimalString' }
        currency: { type: string, minLength: 1, maxLength: 32 }
        sourceScale: { type: integer, minimum: 0 }
    Quantity:
      type: object
      required: [value, sourceScale]
      properties:
        value: { $ref: '#/components/schemas/DecimalString' }
        sourceScale: { type: integer, minimum: 0 }
    Price:
      type: object
      required: [value, sourceScale]
      properties:
        value: { $ref: '#/components/schemas/DecimalString' }
        sourceScale: { type: integer, minimum: 0 }
    Rational:
      type: object
      required: [numerator, denominator]
      properties:
        numerator: { type: string, pattern: '^-?(0|[1-9][0-9]*)$' }
        denominator: { type: string, pattern: '^[1-9][0-9]*$' }
      description: 기약분수. Ratio와 percentage point에 사용하며 denominator는 양수다.
    DurationValue:
      type: object
      required: [microseconds]
      properties:
        microseconds: { type: integer, format: int64, minimum: 0 }
        iso8601: { type: string, pattern: '^P' }
    AnalysisPeriod:
      type: object
      required: [startInclusive, endExclusive]
      properties:
        startInclusive: { type: string, format: date-time }
        endExclusive: { type: string, format: date-time }
    PageMetadata:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    StructuredFailure:
      type: object
      required: [code, message, retryable]
      properties:
        code: { $ref: '#/components/schemas/TradingReviewFailureCode' }
        message: { type: string }
        retryable: { type: boolean }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
      description: safe failure only; raw value/identifier/filename/path/URL 금지.
    TradingReviewFailureCode:
      type: string
      enum:
        - MISSING_REQUIRED_ARTIFACT
        - FILE_FORMAT_INVALID
        - REQUIRED_COLUMN_MISSING
        - UNSUPPORTED_SOURCE_SCHEMA
        - UNSUPPORTED_PRODUCT
        - UNSUPPORTED_POSITION_MODE
        - RECORD_CONFLICT
        - CHECKSUM_MISMATCH
        - SOURCE_ARTIFACT_DELETED
        - ARTIFACT_REFERENCE_EXPIRED
        - MISSING_CAPABILITY
        - INVALID_ANALYSIS_CONFIG
        - INCOMPLETE_ANALYSIS_RESULT
        - RESULT_NOT_AVAILABLE
        - VERSION_UNAVAILABLE
        - VERSION_INCOMPATIBLE
        - TARGET_VERSION_RETIRED
        - REPROCESSING_SOURCE_UNAVAILABLE
        - REPROCESSING_NOT_SUPPORTED
        - CANONICAL_SCHEMA_INCOMPATIBLE
        - INSTRUMENT_TERMS_UNAVAILABLE
        - REPROCESSING_CONFLICT
        - REPROCESSING_CANCELLED
        - RESULT_HASH_MISMATCH
        - STALE_RESULT_AFTER_DELETION
        - LINEAGE_INCONSISTENT
        - NOT_COMPARABLE_VERSION
        - ARTIFACT_DELETION_FAILED
        - DERIVED_DATA_DELETION_FAILED
        - DELETION_PARTIALLY_COMPLETED
        - DELETION_BLOCKED_BY_ACTIVE_JOB
        - BACKUP_PURGE_PENDING
        - TEMPORARY_DEPENDENCY_FAILURE
        - INTERNAL_ERROR

    NormalizerVersionSet:
      type: object
      required: [sourceDialectVersionsByArtifactRole, adapterVersion, normalizerVersion, canonicalSchemaVersion, implementationDigest, versionSetHash]
      properties:
        sourceDialectVersionsByArtifactRole:
          type: object
          required: [TRADE_HISTORY, POSITION_HISTORY]
          properties:
            TRADE_HISTORY: { $ref: '#/components/schemas/VersionIdentifier' }
            POSITION_HISTORY: { $ref: '#/components/schemas/VersionIdentifier' }
        adapterVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        normalizerVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        canonicalSchemaVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        implementationDigest: { type: string }
        versionSetHash: { $ref: '#/components/schemas/Sha256' }
    ReconstructionVersionSet:
      type: object
      required: [instrumentTermsVersionByInstrument, reconstructionPolicyVersion, reconciliationVersion, reviewUnitSchemaVersion, evidenceSchemaVersion, implementationDigest, versionSetHash]
      properties:
        instrumentTermsVersionByInstrument:
          type: object
          additionalProperties: { $ref: '#/components/schemas/VersionIdentifier' }
        reconstructionPolicyVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        reconciliationVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        reviewUnitSchemaVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        evidenceSchemaVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        implementationDigest: { type: string }
        versionSetHash: { $ref: '#/components/schemas/Sha256' }
    AnalyticsVersionSet:
      type: object
      required: [metricDefinitionVersionsByMetricId, findingRuleSetVersion, analysisConfigVersion, evidenceSchemaVersion, implementationDigest, versionSetHash]
      properties:
        metricDefinitionVersionsByMetricId:
          type: object
          required: [ENTRY_WITHIN_WINDOW_AFTER_LOSS, INITIAL_EXPOSURE_CHANGE_AFTER_LOSS, WIN_LOSS_HOLDING_DURATION_DIFFERENCE]
          properties:
            ENTRY_WITHIN_WINDOW_AFTER_LOSS: { $ref: '#/components/schemas/VersionIdentifier' }
            INITIAL_EXPOSURE_CHANGE_AFTER_LOSS: { $ref: '#/components/schemas/VersionIdentifier' }
            WIN_LOSS_HOLDING_DURATION_DIFFERENCE: { $ref: '#/components/schemas/VersionIdentifier' }
        findingRuleSetVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        analysisConfigVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        evidenceSchemaVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        implementationDigest: { type: string }
        versionSetHash: { $ref: '#/components/schemas/Sha256' }
    TargetTradingVersionSet:
      type: object
      required: [versionSetHash]
      properties:
        normalizer:
          allOf: [ { $ref: '#/components/schemas/NormalizerVersionSet' } ]
          type: object
          nullable: true
        reconstruction:
          allOf: [ { $ref: '#/components/schemas/ReconstructionVersionSet' } ]
          type: object
          nullable: true
        analytics:
          allOf: [ { $ref: '#/components/schemas/AnalyticsVersionSet' } ]
          type: object
          nullable: true
        versionSetHash: { $ref: '#/components/schemas/Sha256' }

    # ---- Trading Account / Book ----
    TradingVenue:
      type: string
      enum: [BINANCE]
    TradingProductFamily:
      type: string
      enum: [LINEAR_PERPETUAL]
    TradingPositionMode:
      type: string
      enum: [ONE_WAY]
    TradingResourceStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    CreateTradingAccountRequest:
      type: object
      required: [venue, displayName]
      additionalProperties: false
      properties:
        venue: { $ref: '#/components/schemas/TradingVenue' }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    TradingAccount:
      type: object
      required: [id, venue, displayName, status, createdAt]
      properties:
        id: { type: string }
        venue: { $ref: '#/components/schemas/TradingVenue' }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/TradingResourceStatus' }
        createdAt: { type: string, format: date-time }
    TradingAccountPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/TradingAccount' } }
    CreateTradingBookRequest:
      type: object
      required: [displayName, productFamily, positionMode, settlementAsset, reviewTimezone]
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        productFamily: { $ref: '#/components/schemas/TradingProductFamily' }
        positionMode: { $ref: '#/components/schemas/TradingPositionMode' }
        settlementAsset: { type: string, enum: [USDT] }
        reviewTimezone: { type: string, description: IANA timezone ID. }
    TradingBook:
      type: object
      required: [id, tradingAccountId, venue, productFamily, positionMode, settlementAsset, reviewTimezone, status, createdAt]
      properties:
        id: { type: string }
        tradingAccountId: { type: string }
        venue: { $ref: '#/components/schemas/TradingVenue' }
        productFamily: { $ref: '#/components/schemas/TradingProductFamily' }
        positionMode: { $ref: '#/components/schemas/TradingPositionMode' }
        settlementAsset: { type: string }
        reviewTimezone: { type: string }
        status: { $ref: '#/components/schemas/TradingResourceStatus' }
        latestRevisionId: { type: string, nullable: true }
        latestAnalysisRunId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    TradingBookPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/TradingBook' } }

    # ---- Trading Import ----
    TradingArtifactRole:
      type: string
      enum: [TRADE_HISTORY, POSITION_HISTORY]
    ArtifactUploadStatus:
      type: string
      enum: [UPLOADED]
    ArtifactRetentionStatus:
      type: string
      enum: [ACTIVE, RETENTION_SCHEDULED, DELETION_PENDING, DELETED, DELETION_FAILED]
    CreateTradingImportSessionRequest:
      type: object
      required: [sourceTimezone, reviewTimezone, declaredPositionMode]
      additionalProperties: false
      properties:
        sourceTimezone: { type: string, description: IANA timezone ID; source timestamp에서 추론하지 않는다. }
        reviewTimezone: { type: string, description: IANA timezone ID. }
        declaredPositionMode: { $ref: '#/components/schemas/TradingPositionMode' }
        dataPolicyVersion:
          allOf: [ { $ref: '#/components/schemas/VersionIdentifier' } ]
          type: string
          nullable: true
          description: 생략하면 server-selected current immutable ID를 pin한다.
        clientRequestReference: { type: string, maxLength: 100, nullable: true }
    UploadArtifactMetadata:
      type: object
      required: [role, filename, contentType, byteSize, sha256, dialectCandidate]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/TradingArtifactRole' }
        filename: { type: string, minLength: 1, maxLength: 255, description: display metadata only; path/identity 아님. }
        contentType: { type: string, enum: [text/csv, application/vnd.ms-excel] }
        byteSize: { type: integer, format: int64, minimum: 1, maximum: 52428800 }
        sha256: { $ref: '#/components/schemas/Sha256' }
        dialectCandidate:
          type: string
          enum: [AUTO, BINANCE_USDS_TRADE_HISTORY_V1, BINANCE_USDS_POSITION_HISTORY_V1]
    UploadTradingImportArtifactRequest:
      type: object
      required: [metadata, file]
      properties:
        metadata: { $ref: '#/components/schemas/UploadArtifactMetadata' }
        file:
          type: string
          format: binary
          description: 최대 52,428,800 bytes.
    TradingSourceArtifact:
      type: object
      required: [id, importSessionId, role, contentType, byteSize, sha256, uploadStatus, retentionStatus, rawReparseAvailable, coverage, uploadedAt]
      properties:
        id: { type: string }
        importSessionId: { type: string }
        role: { $ref: '#/components/schemas/TradingArtifactRole' }
        filename: { type: string, nullable: true, description: raw lifecycle 뒤 null; storage path가 아니다. }
        contentType: { type: string, enum: [text/csv, application/vnd.ms-excel] }
        byteSize: { type: integer, format: int64, minimum: 1, maximum: 52428800 }
        sha256: { $ref: '#/components/schemas/Sha256' }
        dialectCandidate: { type: string }
        detectedDialect: { type: string, nullable: true }
        schemaFingerprint: { type: string, nullable: true }
        uploadStatus: { $ref: '#/components/schemas/ArtifactUploadStatus' }
        retentionStatus: { $ref: '#/components/schemas/ArtifactRetentionStatus' }
        rawReparseAvailable: { type: boolean }
        coverage:
          allOf: [ { $ref: '#/components/schemas/ArtifactCoverage' } ]
          type: object
          nullable: true
          description: validation 전 또는 timestamp parse 실패 시 null; 유효 artifact는 role별 독립 observed coverage를 보존한다.
        rawExpiresAt: { type: string, format: date-time, nullable: true }
        uploadedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
    ValidateTradingImportSessionRequest:
      type: object
      additionalProperties: false
      properties:
        targetVersionSet:
          allOf: [ { $ref: '#/components/schemas/TargetTradingVersionSet' } ]
          type: object
          nullable: true
          description: 생략하면 server-selected current exact set을 admission에서 pin한다.
    ValidationIssue:
      type: object
      required: [code, severity, artifactRole]
      properties:
        code: { type: string }
        severity: { type: string, enum: [WARNING, ERROR] }
        artifactRole: { $ref: '#/components/schemas/TradingArtifactRole' }
        sourceRowNumber: { type: integer, minimum: 1, nullable: true }
        field: { type: string, nullable: true }
      description: offending raw value는 포함하지 않는다.
    QualityStatus:
      type: string
      enum: [PENDING, ACCEPTABLE, ACCEPTABLE_WITH_EXCLUSIONS, REJECTED]
    TradingQualityReport:
      type: object
      required: [qualityStatus, rowCountsByArtifactRole, ignoredNonTradingRowCounts, validationIssues, reconciliationStatusCounts, capability, excludedReasonCounts]
      properties:
        qualityStatus: { $ref: '#/components/schemas/QualityStatus' }
        rowCountsByArtifactRole:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        ignoredNonTradingRowCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        validationIssues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        reconciliationStatusCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        capability: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/AnalysisCapability' } }
        excludedReasonCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
    TradingImportSessionBase:
      type: object
      required: [id, tradingBookId, sourceTimezone, reviewTimezone, declaredPositionMode, artifacts, dataPolicyVersion, retentionPolicy, maskingPolicyVersion, evidenceRetention, deletionPolicyVersion, versions, createdAt]
      properties:
        id: { type: string }
        tradingBookId: { type: string }
        sourceTimezone: { type: string }
        reviewTimezone: { type: string }
        declaredPositionMode: { $ref: '#/components/schemas/TradingPositionMode' }
        artifacts: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/TradingSourceArtifact' } }
        dataPolicyVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        retentionPolicy: { $ref: '#/components/schemas/VersionIdentifier' }
        maskingPolicyVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        evidenceRetention: { type: string, enum: [BOOK_LIFECYCLE] }
        deletionPolicyVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        versions: { $ref: '#/components/schemas/TargetTradingVersionSet' }
        createdAt: { type: string, format: date-time }
        validationStartedAt: { type: string, format: date-time, nullable: true }
    TradingImportSessionNonTerminal:
      allOf:
        - $ref: '#/components/schemas/TradingImportSessionBase'
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [RECEIVED, VALIDATING] }
    TradingImportSessionAccepted:
      allOf:
        - $ref: '#/components/schemas/TradingImportSessionBase'
        - type: object
          required: [status, qualitySummary, createdLedgerRevisionId, completedAt]
          properties:
            status: { type: string, enum: [ACCEPTED] }
            qualitySummary: { $ref: '#/components/schemas/TradingQualityReport' }
            createdLedgerRevisionId: { type: string }
            completedAt: { type: string, format: date-time }
    TradingImportSessionRejected:
      allOf:
        - $ref: '#/components/schemas/TradingImportSessionBase'
        - type: object
          required: [status, qualitySummary, failure, completedAt]
          properties:
            status: { type: string, enum: [REJECTED] }
            qualitySummary: { $ref: '#/components/schemas/TradingQualityReport' }
            failure: { $ref: '#/components/schemas/StructuredFailure' }
            completedAt: { type: string, format: date-time }
    TradingImportSession:
      oneOf:
        - $ref: '#/components/schemas/TradingImportSessionNonTerminal'
        - $ref: '#/components/schemas/TradingImportSessionAccepted'
        - $ref: '#/components/schemas/TradingImportSessionRejected'
      discriminator:
        propertyName: status
        mapping:
          RECEIVED: '#/components/schemas/TradingImportSessionNonTerminal'
          VALIDATING: '#/components/schemas/TradingImportSessionNonTerminal'
          ACCEPTED: '#/components/schemas/TradingImportSessionAccepted'
          REJECTED: '#/components/schemas/TradingImportSessionRejected'
    TradingImportSessionPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/TradingImportSession' } }

    AnalysisCapability:
      type: string
      enum: [CLOSED_OUTCOME, INITIAL_EXPOSURE, MAX_EXPOSURE, POSITION_INCREASES, FEES, FUNDING_PAYMENTS, MARKET_PRICE_PATH, VENUE_REPORTED_PNL, POSITION_MODE_USER_DECLARED, POSITION_MODE_OBSERVED_COMPATIBLE, VENUE_POSITION_SUMMARY, EXECUTION_ORIGIN_KNOWN, STABLE_EPISODE_TIME]
    ArtifactCoverage:
      type: object
      required: [earliestObservedAt, latestObservedAt, rowCount, sourceTimezone, timestampPrecision, coverageCompleteness]
      additionalProperties: false
      properties:
        earliestObservedAt: { type: string, format: date-time, nullable: true }
        latestObservedAt: { type: string, format: date-time, nullable: true }
        rowCount: { type: integer, format: int64, minimum: 0 }
        sourceTimezone: { type: string, description: ImportSession에 고정된 IANA timezone ID. }
        timestampPrecision: { type: string, enum: [SECOND] }
        coverageCompleteness: { type: string, enum: [NOT_PROVEN] }
      description: Trade는 Time min/max, Position은 Opened min/Closed max인 observed coverage이며 거래소 export의 연속성·완전성을 증명하지 않는다.
    Coverage:
      type: object
      required: [startInclusive, endExclusive]
      properties:
        startInclusive: { type: string, format: date-time }
        endExclusive: { type: string, format: date-time }
    InstrumentDescriptor:
      type: object
      required: [instrumentId, venue, venueSymbol, productFamily, baseAsset, quoteAsset, settlementAsset, quantityUnit, priceUnit, instrumentTermsVersion]
      properties:
        instrumentId: { type: string }
        venue: { $ref: '#/components/schemas/TradingVenue' }
        venueSymbol: { type: string, description: lossless opaque source symbol; trim/case/Unicode normalization 금지. }
        productFamily: { $ref: '#/components/schemas/TradingProductFamily' }
        baseAsset: { type: string }
        quoteAsset: { type: string }
        settlementAsset: { type: string }
        quantityUnit: { type: string }
        priceUnit: { type: string }
        contractMultiplier: { $ref: '#/components/schemas/DecimalString' }
        instrumentTermsVersion: { $ref: '#/components/schemas/VersionIdentifier' }
    VersionLineage:
      type: object
      required: [parentLedgerRevisionIds, sourceImportSessionIds, sourceVersionSet, targetVersionSet, initiatedBy, inputAvailability, resultHash, createdAt]
      properties:
        parentLedgerRevisionIds: { type: array, items: { type: string } }
        parentAnalysisRunId: { type: string, nullable: true }
        sourceImportSessionIds: { type: array, minItems: 1, items: { type: string } }
        reprocessingRunId: { type: string, nullable: true }
        reprocessingType: { $ref: '#/components/schemas/ReprocessingType' }
        reasonCode: { type: string, nullable: true }
        sourceVersionSet: { $ref: '#/components/schemas/TargetTradingVersionSet' }
        targetVersionSet: { $ref: '#/components/schemas/TargetTradingVersionSet' }
        initiatedBy: { type: string, enum: [USER_REQUESTED, SYSTEM_MIGRATION, BUG_FIX, SECURITY_FIX, DEFINITION_UPGRADE, SUPPORT_RECOVERY] }
        inputAvailability: { $ref: '#/components/schemas/ReprocessingInputAvailability' }
        resultHash: { $ref: '#/components/schemas/Sha256' }
        createdAt: { type: string, format: date-time }
    LedgerRevision:
      type: object
      required: [id, tradingBookId, revisionNumber, contentHash, sourceImportSessionIds, coverage, canonicalRecordCount, instrumentDescriptors, normalizerVersionSet, reconstructionVersionSet, reconciliationManifestHash, capability, qualitySummary, parentLedgerRevisionIds, createdAt]
      properties:
        id: { type: string }
        tradingBookId: { type: string }
        revisionNumber: { type: integer, format: int64, minimum: 1 }
        contentHash: { $ref: '#/components/schemas/Sha256' }
        sourceImportSessionIds: { type: array, minItems: 1, items: { type: string } }
        coverage: { $ref: '#/components/schemas/Coverage' }
        canonicalRecordCount: { type: integer, format: int64, minimum: 0 }
        instrumentDescriptors: { type: array, items: { $ref: '#/components/schemas/InstrumentDescriptor' } }
        normalizerVersionSet: { $ref: '#/components/schemas/NormalizerVersionSet' }
        reconstructionVersionSet: { $ref: '#/components/schemas/ReconstructionVersionSet' }
        dataPolicyVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        reconciliationManifestHash: { $ref: '#/components/schemas/Sha256' }
        capability: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/AnalysisCapability' } }
        qualitySummary: { $ref: '#/components/schemas/TradingQualityReport' }
        parentLedgerRevisionIds: { type: array, items: { type: string } }
        lineage:
          allOf: [ { $ref: '#/components/schemas/VersionLineage' } ]
          type: object
          nullable: true
        createdAt: { type: string, format: date-time }
    LedgerRevisionPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/LedgerRevision' } }

    # ---- Trading Analysis ----
    MetricMinimums:
      type: object
      required: [reentryEligibleLosses, exposurePairs, priorBaselineEpisodes, holdingWins, holdingLosses]
      properties:
        reentryEligibleLosses: { type: integer, minimum: 1 }
        exposurePairs: { type: integer, minimum: 1 }
        priorBaselineEpisodes: { type: integer, minimum: 1 }
        holdingWins: { type: integer, minimum: 1 }
        holdingLosses: { type: integer, minimum: 1 }
    FindingMinimums:
      type: object
      required: [reentryEligibleLosses, exposurePairs, holdingWins, holdingLosses]
      properties:
        reentryEligibleLosses: { type: integer, minimum: 1 }
        exposurePairs: { type: integer, minimum: 1 }
        holdingWins: { type: integer, minimum: 1 }
        holdingLosses: { type: integer, minimum: 1 }
    AnalysisConfig:
      type: object
      required: [schemaVersion, analysisPeriod, reviewTimezone, timezoneDatabaseVersion, outcomeBasis, fundingTreatment, eligibleReviewUnitPolicy, reversalTreatment, reentryWindow, baselinePolicy, metricMinimums, findingMinimums]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, enum: [1] }
        analysisPeriod: { $ref: '#/components/schemas/AnalysisPeriod' }
        reviewTimezone: { type: string }
        timezoneDatabaseVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        outcomeBasis: { type: string, enum: [NET_TRADING_PNL] }
        fundingTreatment: { type: string, enum: [EXCLUDED] }
        eligibleReviewUnitPolicy: { type: string, enum: [COMPLETE_AND_RECONCILED_ONLY] }
        reversalTreatment: { type: string, enum: [SEPARATE] }
        reentryWindow: { type: string, enum: [PT30M] }
        baselinePolicy: { type: string, enum: [PRIOR_PERIOD_SAME_INSTRUMENT_DIRECTION] }
        metricMinimums: { $ref: '#/components/schemas/MetricMinimums' }
        findingMinimums: { $ref: '#/components/schemas/FindingMinimums' }
    RunTradingAnalysisRequest:
      type: object
      required: [analysisConfig]
      additionalProperties: false
      properties:
        analyticsVersionSet:
          allOf: [ { $ref: '#/components/schemas/AnalyticsVersionSet' } ]
          type: object
          nullable: true
          description: 생략하면 server-selected current exact set을 pin한다.
        analysisConfig: { $ref: '#/components/schemas/AnalysisConfig' }
        publishAsLatest: { type: boolean, default: true }
    AnalysisProgressStage:
      type: string
      enum: [QUEUED, DISPATCHING, RECONSTRUCTING_REVIEW_UNITS, CALCULATING_METRICS, BUILDING_EVIDENCE, PERSISTING_RESULT, TERMINAL]
    TradingAnalysisRunBase:
      type: object
      required: [id, tradingBookId, ledgerRevisionId, progressStage, analyticsVersionSet, analysisConfig, analysisConfigHash, qualityStatus, createdAt, updatedAt]
      properties:
        id: { type: string }
        tradingBookId: { type: string }
        ledgerRevisionId: { type: string }
        progressStage: { $ref: '#/components/schemas/AnalysisProgressStage' }
        analyticsVersionSet: { $ref: '#/components/schemas/AnalyticsVersionSet' }
        analysisConfig: { $ref: '#/components/schemas/AnalysisConfig' }
        analysisConfigHash: { $ref: '#/components/schemas/Sha256' }
        qualityStatus: { $ref: '#/components/schemas/QualityStatus' }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    TradingAnalysisRunNonTerminal:
      allOf:
        - $ref: '#/components/schemas/TradingAnalysisRunBase'
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [PENDING, RUNNING] }
    TradingAnalysisRunCompleted:
      allOf:
        - $ref: '#/components/schemas/TradingAnalysisRunBase'
        - type: object
          required: [status, resultId, resultHash, evidenceHash, completedAt]
          properties:
            status: { type: string, enum: [COMPLETED] }
            resultId: { type: string }
            resultHash: { $ref: '#/components/schemas/Sha256' }
            evidenceHash: { $ref: '#/components/schemas/Sha256' }
            completedAt: { type: string, format: date-time }
    TradingAnalysisRunFailed:
      allOf:
        - $ref: '#/components/schemas/TradingAnalysisRunBase'
        - type: object
          required: [status, failure, completedAt]
          properties:
            status: { type: string, enum: [FAILED] }
            failure: { $ref: '#/components/schemas/StructuredFailure' }
            completedAt: { type: string, format: date-time }
    TradingAnalysisRun:
      oneOf:
        - $ref: '#/components/schemas/TradingAnalysisRunNonTerminal'
        - $ref: '#/components/schemas/TradingAnalysisRunCompleted'
        - $ref: '#/components/schemas/TradingAnalysisRunFailed'
      discriminator:
        propertyName: status
        mapping:
          PENDING: '#/components/schemas/TradingAnalysisRunNonTerminal'
          RUNNING: '#/components/schemas/TradingAnalysisRunNonTerminal'
          COMPLETED: '#/components/schemas/TradingAnalysisRunCompleted'
          FAILED: '#/components/schemas/TradingAnalysisRunFailed'
    TradingAnalysisRunPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/TradingAnalysisRun' } }
    BehaviorMetricId:
      type: string
      enum: [ENTRY_WITHIN_WINDOW_AFTER_LOSS, INITIAL_EXPOSURE_CHANGE_AFTER_LOSS, WIN_LOSS_HOLDING_DURATION_DIFFERENCE]
    MetricStatus:
      type: string
      enum: [AVAILABLE, INSUFFICIENT_SAMPLE, MISSING_CAPABILITY, NOT_APPLICABLE]
    FindingEligibility:
      type: string
      enum: [ELIGIBLE, INELIGIBLE_SAMPLE, INELIGIBLE_METRIC_STATUS]
    EvidenceMembershipRole:
      type: string
      enum: [SUPPORTING, COMPARISON, EXCLUDED_CANDIDATE, SELECTION_BOUNDARY]
    MembershipReference:
      type: object
      required: [reviewUnitId, role]
      properties:
        reviewUnitId: { type: string }
        role: { $ref: '#/components/schemas/EvidenceMembershipRole' }
        exclusionReason: { type: string, nullable: true }
    MembershipSummary:
      type: object
      required: [items, total, evidenceReference]
      properties:
        items:
          type: array
          description: deterministic first page; full logical membership는 evidenceReference에 포함된다.
          items: { $ref: '#/components/schemas/MembershipReference' }
        total: { type: integer, format: int64, minimum: 0 }
        evidenceReference: { type: string }
    BehaviorMetricValue:
      type: object
      description: Metric definition에 해당하는 typed field만 채운다. AVAILABLE이 아니면 모든 scalar는 null이다.
      properties:
        decimal:
          allOf: [ { $ref: '#/components/schemas/DecimalString' } ]
          type: string
          nullable: true
        ratio:
          allOf: [ { $ref: '#/components/schemas/Rational' } ]
          type: object
          nullable: true
        percentagePoint:
          allOf: [ { $ref: '#/components/schemas/Rational' } ]
          type: object
          nullable: true
        duration:
          allOf: [ { $ref: '#/components/schemas/DurationValue' } ]
          type: object
          nullable: true
        count: { type: integer, format: int64, nullable: true }
    BehaviorMetric:
      type: object
      required: [id, analysisRunId, definitionId, definitionVersion, status, findingEligibility, analysisPeriod, populationCount, eligibleCount, excludedCount, excludedReasonCounts, capabilitySnapshot, memberships, value, fundingTreatment, outcomeBasis, evidenceReference, resultHash]
      properties:
        id: { type: string }
        analysisRunId: { type: string }
        definitionId: { $ref: '#/components/schemas/BehaviorMetricId' }
        definitionVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        status: { $ref: '#/components/schemas/MetricStatus' }
        findingEligibility: { $ref: '#/components/schemas/FindingEligibility' }
        analysisPeriod: { $ref: '#/components/schemas/AnalysisPeriod' }
        populationCount: { type: integer, format: int64, minimum: 0 }
        eligibleCount: { type: integer, format: int64, minimum: 0 }
        excludedCount: { type: integer, format: int64, minimum: 0 }
        excludedReasonCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        capabilitySnapshot: { type: array, items: { $ref: '#/components/schemas/AnalysisCapability' } }
        memberships: { $ref: '#/components/schemas/MembershipSummary' }
        comparisonDefinition: { type: string }
        scalarInputsReference: { type: string }
        value: { $ref: '#/components/schemas/BehaviorMetricValue' }
        fundingTreatment: { type: string, enum: [EXCLUDED] }
        outcomeBasis: { type: string, enum: [NET_TRADING_PNL] }
        evidenceReference: { type: string }
        resultHash: { $ref: '#/components/schemas/Sha256' }
    ReconstructionStatus:
      type: string
      enum: [COMPLETE, LEFT_CENSORED, RIGHT_CENSORED, INCONSISTENT, UNSUPPORTED]
    ReconciliationStatus:
      type: string
      enum: [EXACT, WITHIN_ROUNDING_TOLERANCE, AMBIGUOUS, INCOMPLETE_TRADES, SUMMARY_MISMATCH, UNSUPPORTED_OVERLAP]
    OutcomeClassification:
      type: string
      enum: [LOSS, BREAKEVEN, WIN, UNAVAILABLE]
    TradingOutcome:
      type: object
      required: [classification, fundingTreatment]
      properties:
        classification: { $ref: '#/components/schemas/OutcomeClassification' }
        grossTradingPnl:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          type: object
          nullable: true
        venuePositionPnl:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          type: object
          nullable: true
        tradingFees:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          type: object
          nullable: true
        netTradingPnl:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          type: object
          nullable: true
        fundingTreatment: { type: string, enum: [EXCLUDED] }
    ReviewUnit:
      type: object
      required: [id, analysisRunId, type, instrumentIds, direction, outcome, reconstructionStatus, reconciliationStatus, capability, dataQuality]
      properties:
        id: { type: string }
        analysisRunId: { type: string }
        type: { type: string, enum: [FUTURES_POSITION_EPISODE] }
        instrumentIds: { type: array, minItems: 1, items: { type: string } }
        direction: { type: string, enum: [LONG, SHORT] }
        openedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        initialQuantity:
          allOf: [ { $ref: '#/components/schemas/Quantity' } ]
          type: object
          nullable: true
        initialNotional:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          type: object
          nullable: true
        outcome: { $ref: '#/components/schemas/TradingOutcome' }
        reconstructionStatus: { $ref: '#/components/schemas/ReconstructionStatus' }
        reconciliationStatus: { $ref: '#/components/schemas/ReconciliationStatus' }
        capability: { type: array, items: { $ref: '#/components/schemas/AnalysisCapability' } }
        dataQuality: { type: array, items: { type: string } }
    ReviewUnitPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ReviewUnit' } }
    PositionAllocationEvidence:
      type: object
      required: [tradingRecordId, action, allocatedQuantity]
      properties:
        tradingRecordId: { type: string }
        action: { type: string, enum: [OPEN, INCREASE, REDUCE, CLOSE, REVERSAL_CLOSE, REVERSAL_OPEN] }
        allocatedQuantity: { $ref: '#/components/schemas/Quantity' }
        allocatedFee:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          type: object
          nullable: true
        allocatedReportedPnl:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          type: object
          nullable: true
    TradingRecordEvidence:
      type: object
      required: [recordId, recordType, sourceEvidenceSnapshotId]
      properties:
        recordId: { type: string }
        recordType: { type: string, enum: [EXECUTION, FEE, VENUE_REPORTED_PNL, VENUE_POSITION_SUMMARY] }
        occurredAt: { type: string, format: date-time, nullable: true }
        openedAt: { type: string, format: date-time, nullable: true, description: Position summary exact UTC instant. }
        closedAt: { type: string, format: date-time, nullable: true, description: Position summary exact UTC instant. }
        price:
          allOf: [ { $ref: '#/components/schemas/Price' } ]
          type: object
          nullable: true
        sourceEvidenceSnapshotId: { type: string }
    SourceField:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string, description: owner-visible allowlisted exact source lexeme; UID/full IDs 금지. }
    SourceEvidenceSnapshot:
      type: object
      required: [id, artifactId, artifactRole, sourceRowNumber, sourceRowHash, dialect, evidenceKind, rawAvailability, rawReparseAvailable, maskingPolicyVersion, allowlistedFields, capturedAt]
      properties:
        id: { type: string }
        artifactId: { type: string }
        artifactRole: { $ref: '#/components/schemas/TradingArtifactRole' }
        sourceRowNumber: { type: integer, minimum: 1 }
        sourceRowHash: { $ref: '#/components/schemas/Sha256' }
        dialect: { $ref: '#/components/schemas/VersionIdentifier' }
        evidenceKind: { type: string, enum: [RETAINED_SNAPSHOT] }
        rawAvailability: { type: string, enum: [AVAILABLE, DELETED] }
        rawReparseAvailable: { type: boolean }
        maskingPolicyVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        maskedTradeId: { type: string, nullable: true, pattern: '^tid_[A-Za-z0-9_-]+$' }
        maskedOrderId: { type: string, nullable: true, pattern: '^oid_[A-Za-z0-9_-]+$' }
        allowlistedFields: { type: array, items: { $ref: '#/components/schemas/SourceField' } }
        capturedAt: { type: string, format: date-time }
    ReviewUnitEvidenceItem:
      type: object
      required: [membershipRole, allocation, tradingRecord, sourceEvidence]
      properties:
        membershipRole: { $ref: '#/components/schemas/EvidenceMembershipRole' }
        exclusionReason: { type: string, nullable: true }
        allocation: { $ref: '#/components/schemas/PositionAllocationEvidence' }
        tradingRecord: { $ref: '#/components/schemas/TradingRecordEvidence' }
        sourceEvidence: { $ref: '#/components/schemas/SourceEvidenceSnapshot' }
    ReviewUnitEvidencePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items, evidenceSchemaVersion, evidenceHash]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ReviewUnitEvidenceItem' } }
            evidenceSchemaVersion: { $ref: '#/components/schemas/VersionIdentifier' }
            evidenceHash: { $ref: '#/components/schemas/Sha256' }
    BehaviorFinding:
      type: object
      required: [id, definitionId, definitionVersion, observation, metricIds, supportingReviewUnitIds, comparisonReviewUnitIds, sampleAssessment, rankReason]
      properties:
        id: { type: string }
        definitionId: { $ref: '#/components/schemas/BehaviorMetricId' }
        definitionVersion: { $ref: '#/components/schemas/VersionIdentifier' }
        observation: { type: string, description: descriptive only; causal/psychological/investment instruction 금지. }
        metricIds: { type: array, minItems: 1, items: { type: string } }
        supportingReviewUnitIds: { type: array, items: { type: string } }
        comparisonReviewUnitIds: { type: array, items: { type: string } }
        sampleAssessment: { type: string, enum: [INSUFFICIENT, LIMITED, DESCRIPTIVE] }
        rankReason: { type: string }
    TradingReview:
      type: object
      required: [analysisRunId, ledgerRevisionId, resultHash, evidenceHash, analysisPeriod, qualitySummary, populationCount, eligibleCount, excludedCount, exclusionReasonCounts, capabilitySnapshot, metrics, findings, analyticsVersionSet, analysisConfig, analysisConfigHash, fundingTreatment, outcomeBasis, createdAt]
      properties:
        analysisRunId: { type: string }
        ledgerRevisionId: { type: string }
        resultHash: { $ref: '#/components/schemas/Sha256' }
        evidenceHash: { $ref: '#/components/schemas/Sha256' }
        analysisPeriod: { $ref: '#/components/schemas/AnalysisPeriod' }
        qualitySummary: { $ref: '#/components/schemas/TradingQualityReport' }
        populationCount: { type: integer, format: int64, minimum: 0 }
        eligibleCount: { type: integer, format: int64, minimum: 0 }
        excludedCount: { type: integer, format: int64, minimum: 0 }
        exclusionReasonCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        capabilitySnapshot: { type: array, items: { $ref: '#/components/schemas/AnalysisCapability' } }
        metrics: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/BehaviorMetric' } }
        findings: { type: array, items: { $ref: '#/components/schemas/BehaviorFinding' } }
        analyticsVersionSet: { $ref: '#/components/schemas/AnalyticsVersionSet' }
        analysisConfig: { $ref: '#/components/schemas/AnalysisConfig' }
        analysisConfigHash: { $ref: '#/components/schemas/Sha256' }
        lineage:
          allOf: [ { $ref: '#/components/schemas/VersionLineage' } ]
          type: object
          nullable: true
        fundingTreatment: { type: string, enum: [EXCLUDED] }
        outcomeBasis: { type: string, enum: [NET_TRADING_PNL] }
        createdAt: { type: string, format: date-time }

    # ---- Trading Reprocessing / Deletion ----
    ReprocessingType:
      type: string
      enum: [REPARSE_SOURCE, REBUILD_LEDGER, RERUN_RECONSTRUCTION, RERUN_ANALYTICS, REEVALUATE_FINDINGS]
    ReprocessingInputAvailability:
      type: string
      enum: [RAW_AND_CANONICAL, CANONICAL_ONLY, RESULT_ONLY, DELETED]
    ReprocessingRunStatus:
      type: string
      enum: [PENDING, VALIDATING_INPUT, RUNNING, COMPLETED, FAILED, CANCELLED]
    RequestTradingReprocessingRequest:
      type: object
      required: [sourceLedgerRevisionId, reprocessingType, targetVersionSet, reasonCode]
      additionalProperties: false
      properties:
        sourceLedgerRevisionId: { type: string }
        sourceAnalysisRunId: { type: string, nullable: true }
        reprocessingType: { $ref: '#/components/schemas/ReprocessingType' }
        targetVersionSet: { $ref: '#/components/schemas/TargetTradingVersionSet' }
        reasonCode:
          type: string
          enum: [USER_REQUESTED, BUG_FIX, DEFINITION_UPGRADE, SUPPORT_RECOVERY]
        analysisConfig:
          allOf: [ { $ref: '#/components/schemas/AnalysisConfig' } ]
          type: object
          nullable: true
        publishAsLatest: { type: boolean, default: true }
    ReprocessingDifferenceSummary:
      type: object
      required: [sourceRevisionId, targetRevisionId, canonicalRecordCountDelta, episodeCountDelta, eligibleCountDelta, excludedCountDelta, exclusionReasonChanges, metricChanges, evidenceChanges, sourceVersionSet, targetVersionSet, outcomeChanged]
      properties:
        sourceRevisionId: { type: string }
        targetRevisionId: { type: string }
        sourceAnalysisRunId: { type: string, nullable: true }
        targetAnalysisRunId: { type: string, nullable: true }
        canonicalRecordCountDelta: { type: integer, format: int64 }
        episodeCountDelta: { type: integer, format: int64 }
        eligibleCountDelta: { type: integer, format: int64 }
        excludedCountDelta: { type: integer, format: int64 }
        exclusionReasonChanges: { type: array, items: { type: string } }
        metricChanges: { type: array, items: { type: string } }
        evidenceChanges: { type: array, items: { type: string } }
        sourceVersionSet: { $ref: '#/components/schemas/TargetTradingVersionSet' }
        targetVersionSet: { $ref: '#/components/schemas/TargetTradingVersionSet' }
        outcomeChanged: { type: boolean }
    TradingReprocessingRun:
      type: object
      required: [id, tradingBookId, sourceLedgerRevisionId, reprocessingType, sourceVersionSet, targetVersionSet, inputAvailability, status, progressStage, lineageParentRevisionIds, createdAt, updatedAt]
      properties:
        id: { type: string }
        tradingBookId: { type: string }
        sourceLedgerRevisionId: { type: string }
        sourceAnalysisRunId: { type: string, nullable: true }
        reprocessingType: { $ref: '#/components/schemas/ReprocessingType' }
        reasonCode: { type: string }
        sourceVersionSet: { $ref: '#/components/schemas/TargetTradingVersionSet' }
        targetVersionSet: { $ref: '#/components/schemas/TargetTradingVersionSet' }
        inputAvailability: { $ref: '#/components/schemas/ReprocessingInputAvailability' }
        status: { $ref: '#/components/schemas/ReprocessingRunStatus' }
        progressStage: { type: string }
        lineageParentRevisionIds: { type: array, minItems: 1, items: { type: string } }
        retryOfReprocessingRunId: { type: string, nullable: true }
        createdLedgerRevisionId: { type: string, nullable: true }
        createdAnalysisRunId: { type: string, nullable: true }
        differenceSummary:
          allOf: [ { $ref: '#/components/schemas/ReprocessingDifferenceSummary' } ]
          type: object
          nullable: true
        failure:
          allOf: [ { $ref: '#/components/schemas/StructuredFailure' } ]
          type: object
          nullable: true
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    TradingReprocessingRunPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/TradingReprocessingRun' } }
    DeletionTargetType:
      type: string
      enum: [TRADING_SOURCE_ARTIFACT, TRADING_IMPORT_SESSION, TRADING_BOOK, TRADING_ACCOUNT, MEMBER]
    DeletionRequestState:
      type: string
      enum: [REQUESTED, CANCELLING_JOBS, PURGING_PRIMARY, PURGING_OBJECTS, COMPLETED, FAILED]
    PurgeComponentStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, FAILED, NOT_APPLICABLE]
    AffectedResourceSummary:
      type: object
      required: [accounts, books, importSessions, artifacts, ledgerRevisions, analysisRuns, reprocessingRuns]
      properties:
        accounts: { type: integer, format: int64, minimum: 0 }
        books: { type: integer, format: int64, minimum: 0 }
        importSessions: { type: integer, format: int64, minimum: 0 }
        artifacts: { type: integer, format: int64, minimum: 0 }
        ledgerRevisions: { type: integer, format: int64, minimum: 0 }
        analysisRuns: { type: integer, format: int64, minimum: 0 }
        reprocessingRuns: { type: integer, format: int64, minimum: 0 }
    DeletionRequest:
      type: object
      required: [id, targetType, targetId, requestedScope, state, affectedResources, revokedAt, primaryPurgeStatus, objectPurgeStatus, computeRuntimePurgeStatus, backupPurgeStatus, retryable, requestedAt, updatedAt]
      properties:
        id: { type: string }
        targetType: { $ref: '#/components/schemas/DeletionTargetType' }
        targetId: { type: string, description: opaque resource ID; storage locator가 아니다. }
        requestedScope: { type: string }
        state: { $ref: '#/components/schemas/DeletionRequestState' }
        affectedResources: { $ref: '#/components/schemas/AffectedResourceSummary' }
        revokedAt: { type: string, format: date-time }
        primaryPurgeStatus: { $ref: '#/components/schemas/PurgeComponentStatus' }
        objectPurgeStatus: { $ref: '#/components/schemas/PurgeComponentStatus' }
        computeRuntimePurgeStatus: { $ref: '#/components/schemas/PurgeComponentStatus' }
        backupPurgeStatus: { $ref: '#/components/schemas/PurgeComponentStatus' }
        backupPurgeDueAt: { type: string, format: date-time, nullable: true }
        failure:
          allOf: [ { $ref: '#/components/schemas/StructuredFailure' } ]
          type: object
          nullable: true
        retryable: { type: boolean }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    # ---- Strategy ----
    StrategySummary:
      type: object
      required: [id, name, createdAt, latestVersionId]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        latestVersionId:
          type: string
          nullable: true
          description: 아직 StrategyVersion이 하나도 없으면 null.

    StrategyDetail:
      allOf:
        - $ref: '#/components/schemas/StrategySummary'
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items:
                $ref: '#/components/schemas/StrategyVersion'

    DefineStrategyVersionRequest:
      type: object
      required: [primarySignalAsset, conditions, executionAsset, lag, exit]
      description: |
        `docs/DOMAIN.md` §1.2 StrategyVersion 중 사용자가 지정하는 필드만 포함한다.
        `positionPolicy`는 서버가 ADR-009 고정값으로 채우므로 요청 바디에 없다 — `compute-api.yaml`의
        `StrategyVersionPayload`(Compute 전달용, positionPolicy 포함)와는 다른 스키마다.
      properties:
        primarySignalAsset:
          $ref: 'compute-api.yaml#/components/schemas/AssetSymbol'
        conditions:
          type: array
          minItems: 1
          items:
            $ref: 'compute-api.yaml#/components/schemas/Condition'
        executionAsset:
          $ref: 'compute-api.yaml#/components/schemas/ExecutionAssetSymbol'
        lag:
          type: integer
          minimum: 0
        exit:
          type: object
          required: [holdingSignalSessions]
          properties:
            holdingSignalSessions: { type: integer, minimum: 1 }

    StrategyVersion:
      allOf:
        - $ref: '#/components/schemas/DefineStrategyVersionRequest'
        - type: object
          required: [id, strategyId, createdAt]
          properties:
            id: { type: string }
            strategyId: { type: string }
            createdAt: { type: string, format: date-time }

    StrategyVersionValidationError:
      type: object
      required: [message, violations]
      description: Compute의 `ValidationErrorResponse`(DSL 의미론적 오류)와는 다른, Core 도메인 불변식 위반 전용 스키마(`docs/DOMAIN.md` §1.2).
      properties:
        message: { type: string }
        violations:
          type: array
          items: { type: string }
          example:
            - "primarySignalAsset은 정확히 1개여야 합니다"
            - "executionAsset은 MVP Asset Universe에 속해야 합니다"

    # ---- Backtest ----
    BacktestRunStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
      description: "`compute-api.yaml`의 `BacktestStatus`와 동일한 값 집합(`docs/DOMAIN.md` §1.3)."

    BacktestRunSummary:
      type: object
      required: [id, strategyId, strategyVersionId, status, requestedPeriod, feeModel, createdAt]
      properties:
        id: { type: string }
        strategyId: { type: string }
        strategyVersionId: { type: string }
        status:
          $ref: '#/components/schemas/BacktestRunStatus'
        requestedPeriod:
          $ref: 'compute-api.yaml#/components/schemas/Period'
        feeModel:
          $ref: 'compute-api.yaml#/components/schemas/FeeModel'
        createdAt: { type: string, format: date-time }

    LatestCompletedBacktestRunResponse:
      type: object
      required: [run]
      properties:
        run:
          allOf:
            - $ref: '#/components/schemas/BacktestRunSummary'
          type: object
          nullable: true

    LatestTerminalBacktestRunResponse:
      type: object
      required: [run]
      properties:
        run:
          allOf:
            - $ref: '#/components/schemas/BacktestRunSummary'
          type: object
          nullable: true

    BacktestRunDetail:
      allOf:
        - $ref: '#/components/schemas/BacktestRunSummary'
        - type: object
          properties:
            actualPeriod:
              allOf:
                - $ref: 'compute-api.yaml#/components/schemas/Period'
              type: object
              nullable: true
              description: Asset Availability 교집합 반영 후 실제 기간. PENDING이면 null(`docs/DOMAIN.md` §1.3).
            datasetSnapshotId:
              type: string
              nullable: true
              description: PENDING이면 null — Compute가 실행 시작 후 채움(`docs/DOMAIN.md` §1.3 불변식).
            engineVersion:
              type: string
              nullable: true
            result:
              allOf:
                - $ref: 'compute-api.yaml#/components/schemas/BacktestResult'
              type: object
              nullable: true
              description: status가 COMPLETED일 때만 존재.
            failureReason:
              type: string
              nullable: true
              description: status가 FAILED일 때만 존재.
            errorCode:
              allOf:
                - $ref: 'compute-api.yaml#/components/schemas/FatalErrorCode'
              type: string
              nullable: true
              description: Compute가 structured fatal error를 반환한 FAILED run에만 존재.

    # ---- Account ----
    Member:
      type: object
      required: [id, role, createdAt]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [MEMBER, ADMIN]
        createdAt: { type: string, format: date-time }

    SubscriptionTier:
      type: string
      enum: [FREE, PRO]

    Subscription:
      type: object
      required: [tier]
      properties:
        tier:
          $ref: '#/components/schemas/SubscriptionTier'

    Usage:
      type: object
      required: [tier, backtestsUsedThisMonth, backtestMonthlyLimit, allowedAssets, maxBacktestPeriodDays]
      description: "UTC calendar month 기준 현재 tier의 Backtest 정책과 사용량. 한도 필드는 null이 아니다."
      properties:
        tier:
          $ref: '#/components/schemas/SubscriptionTier'
        backtestsUsedThisMonth: { type: integer }
        backtestMonthlyLimit:
          type: integer
          description: FREE는 30, PRO는 500.
        allowedAssets:
          type: array
          items:
            $ref: 'compute-api.yaml#/components/schemas/AssetSymbol'
          description: FREE는 QQQ/SPY/BTCUSDT, PRO는 MVP Asset Universe 전체.
        maxBacktestPeriodDays:
          type: integer
          description: FREE는 365, PRO는 3650.
