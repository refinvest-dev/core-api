        '200':
          description: "`COMPLETED`이면 resultId/resultHash 필수."
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingAnalysisRun' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /trading-books/{tradingBookId}/analysis-runs:
    get:
      operationId: listTradingAnalysisRuns
      tags: [trading-analysis]
      summary: Book AnalysisRun 목록 (`ListTradingAnalysisRuns`)
      parameters:
        - $ref: '#/components/parameters/TradingBookId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingAnalysisRunPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

