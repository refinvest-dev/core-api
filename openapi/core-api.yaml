          schema: { $ref: '#/components/schemas/BehaviorMetricId' }
      responses:
        '200':
          description: status와 value null/zero를 구분한다.
          content: { application/json: { schema: { $ref: '#/components/schemas/BehaviorMetric' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResultUnavailable' }
        '410': { $ref: '#/components/responses/Gone' }

  /trading-analysis-runs/{analysisRunId}/review-units:
