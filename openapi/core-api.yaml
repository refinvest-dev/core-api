openapi: 3.0.3
info:
  title: core-api Public API
  version: "0.1.0"
  description: |
    Web(`web`) → Core(`core-api`) 계약. Web은 이 스펙만 보고 구현하며,
    Compute(`compute-api`)를 직접 호출하지 않는다(`AGENTS.md` §3, `AI_AGENT.md` §4).

    - 이 스펙은 `context` 레포가 소유한다. `compute-api.yaml`과 공유 도메인 타입
      (Asset/Condition/BacktestResult 등)을 파일 간 `$ref`로 재사용한다 — 같은 개념을 두 번
      정의하지 않는다.
    - 필드명은 `docs/GLOSSARY.md`의 코드 네이밍을 그대로 따른다(`docs/USECASES.md`).
    - `RunBacktest`는 **항상 비동기**다(`AGENTS.md` §4, `AI_AGENT.md` §2). DSL 의미론적 오류
      (`compute-api.yaml`의 `DSL_INVALID` 등 `FatalErrorCode`)는 이 API에서 동기 400으로 나타나지
      않고, 202 Accepted 이후 폴링 중 `status: FAILED`로 드러난다. 반면 StrategyVersion 자체의
      구조적 불변식 위반(`docs/DOMAIN.md` §1.2)은 `DefineStrategyVersion` 시점에 동기 400으로
      즉시 반환된다 — 이 둘은 서로 다른 계층의 검증이며 에러 스키마도 분리되어 있다(아래
      `StrategyVersionValidationError` vs `compute-api.yaml`의 `ValidationErrorResponse`).

    ## 인증
    - 인증은 Kakao, Naver, Google 소셜 로그인과 RefInvest 발급 JWT Cookie를 사용한다. Provider access
      token은 RefInvest 인증 토큰으로 사용하거나 영속화하지 않는다.
    - Access/Refresh JWT는 HttpOnly Cookie로만 전달한다. Web은 `POST /auth/refresh`와
      `POST /auth/logout`에 Cookie를 포함하며, JWT 문자열을 response body에서 받지 않는다.
    - OAuth 로그인 시작 시 `returnTo`에는 Web origin 내부의 상대 경로만 전달할 수 있다. Core는 이를
      OAuth state와 함께 보존·검증하며 임의 외부 URL로 redirect하지 않는다.
    - Free/Pro 정확한 제한 수치(월 백테스트 횟수, 허용 Asset, 백테스트 최대 기간)는 미정
      — `docs/DOMAIN.md` §1.5, Phase 0/2에서 결정.
    - `ListStrategies`/`ListBacktestRuns`의 페이지네이션 방식(offset vs cursor)은 아래 스펙에
      offset 기반으로 잠정 정의했으나 팀 확인 필요.

servers:
  - url: https://api.refinvest.example.com
    description: Web이 호출하는 Core public API. Compute는 이 서버 뒤에서 내부적으로만 호출됨.

security:
  - AccessCookieAuth: []

tags:
  - name: strategies
    description: Strategy/StrategyVersion 생성·조회 (`docs/USECASES.md` Strategy 모듈)
  - name: backtests
    description: 백테스트 실행·조회 (`docs/USECASES.md` Backtest 모듈, 항상 비동기)
  - name: assets
    description: Strategy Builder용 Asset 메타데이터와 향후 Data Explorer용 보류 시계열 프록시 (`docs/USECASES.md`, ADR-049)
  - name: account
    description: 소셜 로그인·세션·사용량·구독 (`docs/USECASES.md` Member / Auth / Subscription 모듈)

paths:
  # ============ Strategy ============
  /strategies:
    post:
      operationId: createStrategy
      tags: [strategies]
      summary: 빈 Strategy 생성 (`CreateStrategy`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: 생성됨.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategySummary'
        '401': { $ref: '#/components/responses/Unauthorized' }

    get:
      operationId: listStrategies
      tags: [strategies]
      summary: 사용자의 전략 목록 (`ListStrategies`)
      description: Free/Pro 개수 제한은 `docs/DOMAIN.md` §1.5 — 정확한 수치는 미정(TODO 참고).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StrategySummary'
                  page: { type: integer }
                  size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /strategies/{strategyId}:
    get:
      operationId: getStrategy
      tags: [strategies]
      summary: Strategy와 그 StrategyVersion 목록 조회 (`GetStrategy`)
      parameters:
        - $ref: '#/components/parameters/StrategyIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /strategies/{strategyId}/versions:
    post:
      operationId: defineStrategyVersion
      tags: [strategies]
      summary: 새 StrategyVersion 생성 (`DefineStrategyVersion`)
      description: |
        `docs/DOMAIN.md` §1.2 불변식을 동기적으로 검증한다(Primary Signal Asset 정확히 1개,
        Execution Asset이 `ExecutionAssetSymbol`에 속함, conditions 최소 1개, window/lag
        양수 등). `positionPolicy`는 요청 바디에 없다 — ADR-009에 따라 서버가 고정값
        (`longOnly: true, singlePosition: true, duplicateEntry: IGNORE`)으로 채운다.
        생성된 StrategyVersion은 불변이다(ADR-013) — 수정 API는 없고, 조건을 바꾸려면 이 엔드포인트를
        다시 호출해 새 버전을 만든다.
      parameters:
        - $ref: '#/components/parameters/StrategyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefineStrategyVersionRequest'
      responses:
        '201':
          description: 생성됨.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyVersion'
        '400':
          description: StrategyVersion 구조적 불변식 위반(`docs/DOMAIN.md` §1.2). Compute의 DSL 의미론적 검증(Calendar 호환성 등)과는 다른 계층 — 위 info.description 참고.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyVersionValidationError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /strategies/{strategyId}/versions/preview:
    post:
      operationId: previewStrategy
      tags: [strategies]
      summary: 저장하지 않고 자연어 미리보기 생성 (`PreviewStrategy`)
      description: |
        `DefineStrategyVersionRequest`와 동일한 바디를 받아, StrategyVersion을 생성하지 않고
        자연어 문장만 반환한다. 사용자가 조건을 편집하는 동안(Level 1~3, `docs/ROADMAP.md` Phase 1
        UX) 실시간으로 호출된다. DSL과 문장이 항상 1:1 대응해야 한다(`docs/DOMAIN.md` §1.2 예시).
      parameters:
        - $ref: '#/components/parameters/StrategyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefineStrategyVersionRequest'
      responses:
        '200':
          description: |
            OK. 구조적으로 불완전한 입력(예: conditions 빈 배열)이어도 가능한 범위까지 문장으로
            표현하고 400을 던지지 않는다 — 미리보기는 저장 전 자유 편집 상태를 위한 것이기 때문.
          content:
            application/json:
              schema:
                type: object
                required: [previewText]
                properties:
                  previewText: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============ Backtest ============
  /strategy-versions/{versionId}/backtests:
    post:
      operationId: runBacktest
      tags: [backtests]
      summary: 백테스트 실행 요청, 항상 비동기 (`RunBacktest`)
      description: |
        요청 즉시 `BacktestRun(status=PENDING)`을 반환한다. 절대 동기로 결과를 기다리지 않는다
        (`AGENTS.md` §4, `AI_AGENT.md` §2). 실제 계산은 Core가 내부적으로 Compute의
        `POST /backtests`(`compute-api.yaml`)에 위임한다 — 이 위임은 Web에 노출되지 않는다.
        실행 전에 현재 Subscription tier의 Asset entitlement와 요청 기간을 검사하고, 월간 quota와
        동시 실행 capacity를 원자적으로 예약한다(ADR-020).
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period, feeModel]
              properties:
                period:
                  $ref: 'compute-api.yaml#/components/schemas/Period'
                feeModel:
                  $ref: 'compute-api.yaml#/components/schemas/FeeModel'
      responses:
        '202':
          description: 접수됨.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestRunSummary'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 현재 plan에서 요청 기간 또는 StrategyVersion의 Asset이 허용되지 않음.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                periodNotAllowed:
                  value: { code: BACKTEST_PERIOD_NOT_ALLOWED, message: Requested backtest period is not available for the current plan. }
                assetNotAllowed:
                  value: { code: ASSET_NOT_ALLOWED_FOR_PLAN, message: Requested asset is not available for the current plan. }
        '429':
          description: 현재 tier의 월간 quota 또는 동시 실행 capacity가 소진됨.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                monthlyLimitExceeded:
                  value: { code: BACKTEST_MONTHLY_LIMIT_EXCEEDED, message: Monthly backtest execution limit exceeded. }
                concurrencyLimitExceeded:
                  value: { code: BACKTEST_CONCURRENCY_LIMIT_EXCEEDED, message: Concurrent backtest execution limit exceeded. }
        '404': { $ref: '#/components/responses/NotFound' }

  /backtest-runs/{runId}:
    get:
      operationId: getBacktestRun
      tags: [backtests]
      summary: 상태 폴링 및 결과 조회 (`PollBacktestStatus`, `GetBacktestResult` 통합)
      description: |
        Web은 이 엔드포인트를 2~3초 간격으로 폴링한다(`docs/ARCHITECTURE.md` §5). `status`가
        `COMPLETED`일 때만 `result`가 존재하고, `FAILED`일 때만 `failureReason`/`errorCode`가
        존재한다(`docs/DOMAIN.md` §1.3 불변식).
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestRunDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /strategies/{strategyId}/backtest-runs:
    get:
      operationId: listBacktestRuns
      tags: [backtests]
      summary: 특정 Strategy의 백테스트 실행 이력 (`ListBacktestRuns`)
      description: Second Backtest Rate 계측의 데이터 소스(`docs/ROADMAP.md` Phase 2).
      parameters:
        - $ref: '#/components/parameters/StrategyIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BacktestRunSummary'
                  page: { type: integer }
                  size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============ Asset / Strategy Builder 지원 (시계열 공개는 보류) ============
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: MVP Asset Universe 목록 (`ListAssets`)
      description: Core는 Compute의 `GET /assets`(`compute-api.yaml`) 응답을 그대로 프록시한다. Web은 Compute의 존재를 몰라도 된다(`AI_AGENT.md` §4).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: 'compute-api.yaml#/components/schemas/Asset'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /assets/{symbol}/availability:
    get:
      operationId: getAssetAvailability
      tags: [assets]
      summary: 특정 Asset의 상장일/데이터 가용 구간 (`GetAssetAvailability`)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            $ref: 'compute-api.yaml#/components/schemas/AssetSymbol'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'compute-api.yaml#/components/schemas/AssetAvailability'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assets/series:
    get:
      operationId: getSeries
      tags: [assets]
      summary: 보류된 다중 자산 시계열 capability (`GetSeries`)
      description: |
        Compute의 `GET /series`(`compute-api.yaml`)를 그대로 프록시하는 향후 Data Explorer용 capability다.
        ADR-049에 따라 MVP Web은 이 operation을 호출하거나 사용자에게 노출하지 않는다.
      x-refinvest-mvp-status: deferred
      parameters:
        - name: symbols
          in: query
          required: true
          description: "쉼표로 구분된 Asset Symbol 목록 (예: `QQQ,BTCUSDT`)"
          schema: { type: string }
          example: "QQQ,BTCUSDT"
        - name: metric
          in: query
          required: true
          schema:
            $ref: 'compute-api.yaml#/components/schemas/SeriesMetric'
        - name: start
          in: query
          required: true
          schema: { type: string, format: date }
        - name: end
          in: query
          required: true
          schema: { type: string, format: date }
        - name: datasetSnapshotId
          in: query
          required: false
          description: 과거 재현용 Snapshot ID. 생략하면 요청 시작 시 최신 published Snapshot 하나를 선택한다.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'compute-api.yaml#/components/schemas/SeriesResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: 선택한 DatasetSnapshot을 사용할 수 없거나 시계열 데이터가 손상됨.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'compute-api.yaml#/components/schemas/DatasetUnavailableErrorResponse'
                  - $ref: 'compute-api.yaml#/components/schemas/SeriesDataErrorResponse'

  # ============ Auth / Account ============
  /oauth2/authorization/{provider}:
    get:
      operationId: startSocialLogin
      tags: [account]
      summary: 소셜 로그인 시작 (`SocialLogin`)
      description: |
        Spring Security OAuth2 Authorization Code 흐름을 시작하고 선택한 provider로 302 redirect한다.
        로그인 성공 시 Access/Refresh Cookie를 설정한 뒤 `returnTo`의 검증된 상대 경로로 Web에
        redirect한다. provider callback(`/login/oauth2/code/{provider}`)은 provider 전용 내부 경로다.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [kakao, naver, google] }
        - name: returnTo
          in: query
          required: false
          schema: { type: string, default: / }
          description: Web origin 내부의 `/`로 시작하는 상대 경로. 외부 URL은 거부한다.
      responses:
        '302':
          description: OAuth provider authorization endpoint로 redirect.
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/csrf:
    get:
      operationId: issueCsrfToken
      tags: [account]
      summary: CSRF Cookie 발급
      description: |
        Cookie 인증을 사용하는 변경 요청 전에 호출한다. 응답의 `XSRF-TOKEN` Cookie는 HttpOnly가 아니며,
        Web은 값을 `X-XSRF-TOKEN` header로 echo한다. 인증 Cookie와 CSRF token은 별개다.
      security: []
      responses:
        '204':
          description: CSRF Cookie가 설정됨.

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [account]
      summary: Access/Refresh JWT 교체 (`RefreshSession`)
      description: |
        Refresh Cookie로 Refresh Token Rotation을 수행한다. 성공하면 기존 Refresh Token은 즉시
        무효화되고 새 Access/Refresh Cookie가 설정된다. JWT 문자열은 response body에 포함하지 않는다.
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          schema: { type: string }
          description: `XSRF-TOKEN` Cookie 값을 echo한 CSRF token.
      security:
        - RefreshCookieAuth: []
      responses:
        '204':
          description: 새 Access/Refresh Cookie가 설정됨.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: CSRF token이 없거나 Cookie 값과 일치하지 않음.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      operationId: logout
      tags: [account]
      summary: 현재 세션 로그아웃 (`Logout`)
      description: Refresh Token 또는 그 가족을 무효화하고 Access/Refresh Cookie를 제거한다.
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          schema: { type: string }
          description: `XSRF-TOKEN` Cookie 값을 echo한 CSRF token.
      security:
        - RefreshCookieAuth: []
      responses:
        '204':
          description: Refresh 상태가 무효화되고 인증 Cookie가 제거됨.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: CSRF token이 없거나 Cookie 값과 일치하지 않음.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /me/usage:
    get:
      operationId: getUsage
      tags: [account]
      summary: 이번 달 사용량 조회 (`GetUsage`)
      description: UTC calendar month 기준 사용량과 현재 Subscription tier의 Backtest 정책(ADR-020)을 반환한다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/subscription/upgrade:
    post:
      operationId: upgradeSubscription
      tags: [account]
      summary: Free → Pro 전환 (`UpgradeSubscription`)
      description: MVP는 상태값만 변경한다 — 실제 결제 연동은 Phase 5(`docs/ROADMAP.md`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    AccessCookieAuth:
      type: apiKey
      in: cookie
      name: REFINVEST_ACCESS_TOKEN
      description: RefInvest 발급 Access JWT(HttpOnly Cookie). Web은 이 값을 직접 읽지 않는다.
    RefreshCookieAuth:
      type: apiKey
      in: cookie
      name: REFINVEST_REFRESH_TOKEN
      description: RefInvest 발급 Refresh JWT(HttpOnly Cookie). refresh/logout 경계에서만 사용한다.

  parameters:
    StrategyIdParam:
      name: strategyId
      in: path
      required: true
      schema: { type: string }
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Unauthorized:
      description: 인증 실패.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 존재하지 않거나 본인 소유가 아님.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: 잘못된 요청.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    # ---- Strategy ----
    StrategySummary:
      type: object
      required: [id, name, createdAt, latestVersionId]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        latestVersionId:
          type: string
          nullable: true
          description: 아직 StrategyVersion이 하나도 없으면 null.

    StrategyDetail:
      allOf:
        - $ref: '#/components/schemas/StrategySummary'
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items:
                $ref: '#/components/schemas/StrategyVersion'

    DefineStrategyVersionRequest:
      type: object
      required: [primarySignalAsset, conditions, executionAsset, lag, exit]
      description: |
        `docs/DOMAIN.md` §1.2 StrategyVersion 중 사용자가 지정하는 필드만 포함한다.
        `positionPolicy`는 서버가 ADR-009 고정값으로 채우므로 요청 바디에 없다 — `compute-api.yaml`의
        `StrategyVersionPayload`(Compute 전달용, positionPolicy 포함)와는 다른 스키마다.
      properties:
        primarySignalAsset:
          $ref: 'compute-api.yaml#/components/schemas/AssetSymbol'
        conditions:
          type: array
          minItems: 1
          items:
            $ref: 'compute-api.yaml#/components/schemas/Condition'
        executionAsset:
          $ref: 'compute-api.yaml#/components/schemas/ExecutionAssetSymbol'
        lag:
          type: integer
          minimum: 0
        exit:
          type: object
          required: [holdingSignalSessions]
          properties:
            holdingSignalSessions: { type: integer, minimum: 1 }

    StrategyVersion:
      allOf:
        - $ref: '#/components/schemas/DefineStrategyVersionRequest'
        - type: object
          required: [id, strategyId, createdAt]
          properties:
            id: { type: string }
            strategyId: { type: string }
            createdAt: { type: string, format: date-time }

    StrategyVersionValidationError:
      type: object
      required: [message, violations]
      description: Compute의 `ValidationErrorResponse`(DSL 의미론적 오류)와는 다른, Core 도메인 불변식 위반 전용 스키마(`docs/DOMAIN.md` §1.2).
      properties:
        message: { type: string }
        violations:
          type: array
          items: { type: string }
          example:
            - "primarySignalAsset은 정확히 1개여야 합니다"
            - "executionAsset은 MVP Asset Universe에 속해야 합니다"

    # ---- Backtest ----
    BacktestRunStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
      description: "`compute-api.yaml`의 `BacktestStatus`와 동일한 값 집합(`docs/DOMAIN.md` §1.3)."

    BacktestRunSummary:
      type: object
      required: [id, strategyId, strategyVersionId, status, requestedPeriod, feeModel, createdAt]
      properties:
        id: { type: string }
        strategyId: { type: string }
        strategyVersionId: { type: string }
        status:
          $ref: '#/components/schemas/BacktestRunStatus'
        requestedPeriod:
          $ref: 'compute-api.yaml#/components/schemas/Period'
        feeModel:
          $ref: 'compute-api.yaml#/components/schemas/FeeModel'
        createdAt: { type: string, format: date-time }

    BacktestRunDetail:
      allOf:
        - $ref: '#/components/schemas/BacktestRunSummary'
        - type: object
          properties:
            actualPeriod:
              allOf:
                - $ref: 'compute-api.yaml#/components/schemas/Period'
              nullable: true
              description: Asset Availability 교집합 반영 후 실제 기간. PENDING이면 null(`docs/DOMAIN.md` §1.3).
            datasetSnapshotId:
              type: string
              nullable: true
              description: PENDING이면 null — Compute가 실행 시작 후 채움(`docs/DOMAIN.md` §1.3 불변식).
            engineVersion:
              type: string
              nullable: true
            result:
              allOf:
                - $ref: 'compute-api.yaml#/components/schemas/BacktestResult'
              nullable: true
              description: status가 COMPLETED일 때만 존재.
            failureReason:
              type: string
              nullable: true
              description: status가 FAILED일 때만 존재.
            errorCode:
              allOf:
                - $ref: 'compute-api.yaml#/components/schemas/FatalErrorCode'
              nullable: true

    # ---- Account ----
    Member:
      type: object
      required: [id, role, createdAt]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [MEMBER, ADMIN]
        createdAt: { type: string, format: date-time }

    SubscriptionTier:
      type: string
      enum: [FREE, PRO]

    Subscription:
      type: object
      required: [tier]
      properties:
        tier:
          $ref: '#/components/schemas/SubscriptionTier'

    Usage:
      type: object
      required: [tier, backtestsUsedThisMonth, backtestMonthlyLimit, allowedAssets, maxBacktestPeriodDays]
      description: "UTC calendar month 기준 현재 tier의 Backtest 정책과 사용량. 한도 필드는 null이 아니다."
      properties:
        tier:
          $ref: '#/components/schemas/SubscriptionTier'
        backtestsUsedThisMonth: { type: integer }
        backtestMonthlyLimit:
          type: integer
          description: FREE는 30, PRO는 500.
        allowedAssets:
          type: array
          items:
            $ref: 'compute-api.yaml#/components/schemas/AssetSymbol'
          description: FREE는 QQQ/SPY/BTCUSDT, PRO는 MVP Asset Universe 전체.
        maxBacktestPeriodDays:
          type: integer
          description: FREE는 365, PRO는 3650.
