          description: full canonical record는 포함하지 않는다.
          content: { application/json: { schema: { $ref: '#/components/schemas/LedgerRevision' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  # ============ Trading Review Analysis / Evidence ============
