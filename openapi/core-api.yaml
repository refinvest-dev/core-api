        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/LedgerRevisionPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ledger-revisions/{ledgerRevisionId}:
    get:
      operationId: getLedgerRevision
