name: Core verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Module boundaries and PostgreSQL regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: refinvest_test
          POSTGRES_USER: refinvest
          POSTGRES_PASSWORD: refinvest-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refinvest -d refinvest_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify test report gate
        run: python3 -B -m unittest discover -s scripts -p test_verify_test_results.py
      - name: Configure isolated test database
        shell: bash
        run: |
          for prefix in CORE_SCHEMA BACKTEST AUTH STRATEGY MEMBER_SUBSCRIPTION TRADING_REVIEW; do
            echo "${prefix}_TEST_JDBC_URL=jdbc:postgresql://127.0.0.1:5432/refinvest_test" >> "$GITHUB_ENV"
            echo "${prefix}_TEST_DB_USER=refinvest" >> "$GITHUB_ENV"
            echo "${prefix}_TEST_DB_PASSWORD=refinvest-ci-only" >> "$GITHUB_ENV"
          done
      - name: Verify modules and run all tests
        run: bash ./gradlew verifyAggregateModuleBoundaries cleanTest test :app:bootJar --no-build-cache --no-daemon --max-workers=2 --console=plain
      - name: Require executed PostgreSQL regression suites
        run: python3 scripts/verify-test-results.py --require-postgres
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/tests/test/**
          if-no-files-found: warn
