spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: refinvest
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  servlet:
    session:
      cookie:
        same-site: Lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

refinvest:
  id:
    node-id: ${SNOWFLAKE_NODE_ID:0}
  security:
    issuer: ${REFINVEST_JWT_ISSUER}
    audience: ${REFINVEST_JWT_AUDIENCE}
    jwt-secret: ${REFINVEST_JWT_SECRET}
    web-origin: ${REFINVEST_WEB_ORIGIN:http://localhost:3001}
    cookie-secure: ${REFINVEST_COOKIE_SECURE:true}
    cookie-same-site: ${REFINVEST_COOKIE_SAME_SITE:Lax}
  compute:
    enabled: ${REFINVEST_COMPUTE_ENABLED:false}
    base-url: ${COMPUTE_API_BASE_URL:http://localhost:8000}
    api-key: ${COMPUTE_API_KEY:}
    dispatch-delay: ${COMPUTE_DISPATCH_DELAY:5000}
